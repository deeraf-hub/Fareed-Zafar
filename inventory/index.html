<script>
/* ============================================================
   INVENTORY MANAGER  —  single file, works offline, no install
   Data is stored in this browser (localStorage) on this device.
   ============================================================ */

/* ---------- 1. DEFAULTS ---------- */

const DEFAULT_CATEGORIES = [
  'Hoodies', 'Jackets', 'Cotton Pants', 'T-Shirts',
  'Bike Jackets', 'Sweat Shirts', 'Polo T-Shirts'
];

const DEFAULT_SIZES  = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
const DEFAULT_COLORS = ['Black', 'White', 'Navy', 'Grey', 'Olive', 'Maroon', 'Beige'];

const CURRENCIES = [
  { code:'PKR', symbol:'Rs' }, { code:'USD', symbol:'$' }, { code:'GBP', symbol:'£' },
  { code:'EUR', symbol:'€' },  { code:'AED', symbol:'AED' }, { code:'SAR', symbol:'SAR' },
  { code:'INR', symbol:'₹' },  { code:'CAD', symbol:'C$' }, { code:'AUD', symbol:'A$' }
];

const BRAND_NAME  = 'Brands Loop';
const STORAGE_KEY = 'clothing-inventory-v1';

/* ---------- 2. DATA ---------- */

let db = null;

function blankDb() {
  return {
    version: 1,
    onboarded: false,
    brand: { name: BRAND_NAME, currency: 'PKR', symbol: 'Rs', lowStock: 5 },
    categories: DEFAULT_CATEGORIES.slice(),
    sizes: DEFAULT_SIZES.slice(),
    colors: DEFAULT_COLORS.slice(),
    products: [],
    movements: [],
    sales: [],
    counters: { sale: 0 }
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    db = raw ? JSON.parse(raw) : blankDb();
  } catch (e) {
    db = blankDb();
  }
  // make sure every key exists even if the file was saved by an older version
  const base = blankDb();
  for (const k in base) if (!(k in db)) db[k] = base[k];
  for (const k in base.brand) if (!(k in db.brand)) db.brand[k] = base.brand[k];
  return db;
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (e) {
    toast('Could not save — browser storage is full or blocked.', 'error');
  }
}

const $  = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

function uid(prefix = 'id') {
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function money(n) {
  const v = Number(n || 0);
  return db.brand.symbol + ' ' + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function num(n) { return Number(n || 0).toLocaleString(); }

function pieces(n) { return num(n) + (Number(n) === 1 ? ' piece' : ' pieces'); }

function todayISO() { return new Date().toISOString().slice(0, 10); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso || '';
  return d.toLocaleDateString(undefined, { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}

function toast(msg, kind = 'ok') {
  const colors = {
    ok:    'bg-emerald-600',
    error: 'bg-rose-600',
    info:  'bg-brandc-600'
  };
  const el = document.createElement('div');
  el.className = (colors[kind] || colors.ok) +
    ' text-white px-4 py-3 rounded-lg shadow-lg text-sm max-w-xs animate-pulse-none';
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 2600);
  setTimeout(() => el.remove(), 3100);
}

/* ---------- 4. SKU + STOCK CALCULATIONS ---------- */

function codeOf(text, len = 3) {
  const clean = String(text || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();
  if (!clean) return 'XXX';
  const words = clean.split(/\s+/);
  if (words.length > 1) return words.map(w => w[0]).join('').slice(0, len).padEnd(len, 'X');
  return clean.replace(/\s/g, '').slice(0, len).padEnd(len, 'X');
}

function makeSku(product, size, color) {
  return [codeOf(product.category, 3), codeOf(product.name, 3), String(size).toUpperCase(), codeOf(color, 3)]
    .join('-');
}

/* every size x color combination becomes one variant row */
function buildVariants(product, existing = []) {
  const map = {};
  existing.forEach(v => { map[v.size + '||' + v.color] = v; });
  const out = [];
  (product.sizes.length ? product.sizes : ['ONE']).forEach(size => {
    (product.colors.length ? product.colors : ['Default']).forEach(color => {
      const key = size + '||' + color;
      if (map[key]) {
        map[key].sku = makeSku(product, size, color);
        out.push(map[key]);
      } else {
        out.push({ id: uid('v'), size, color, qty: 0, sku: makeSku(product, size, color) });
      }
    });
  });
  return out;
}

function productStock(p)  { return p.variants.reduce((s, v) => s + Number(v.qty || 0), 0); }
function productValue(p)  { return productStock(p) * Number(p.cost || 0); }
function productRetail(p) { return productStock(p) * Number(p.price || 0); }
function lowLimit(p)      { return Number(p.lowStock != null && p.lowStock !== '' ? p.lowStock : db.brand.lowStock || 0); }

function stockState(p) {
  const s = productStock(p);
  if (s <= 0) return 'out';
  if (s <= lowLimit(p)) return 'low';
  return 'ok';
}

function findProduct(id)  { return db.products.find(p => p.id === id); }
function findVariant(p, vid) { return p ? p.variants.find(v => v.id === vid) : null; }

function totals() {
  let units = 0, cost = 0, retail = 0, low = 0, out = 0;
  db.products.forEach(p => {
    units  += productStock(p);
    cost   += productValue(p);
    retail += productRetail(p);
    const st = stockState(p);
    if (st === 'low') low++;
    if (st === 'out') out++;
  });
  return { units, cost, retail, low, out, products: db.products.length };
}

function salesBetween(fromISO, toISO) {
  return db.sales.filter(s => {
    const d = s.date.slice(0, 10);
    return (!fromISO || d >= fromISO) && (!toISO || d <= toISO);
  });
}

function saleTotals(list) {
  let revenue = 0, profit = 0, units = 0;
  list.forEach(s => {
    revenue += Number(s.total || 0);
    profit  += Number(s.profit || 0);
    units   += s.lines.reduce((a, l) => a + Number(l.qty || 0), 0);
  });
  return { revenue, profit, units, count: list.length };
}

/* ---------- 5. STOCK MOVEMENTS ---------- */

function recordMovement(productId, variantId, type, qty, reason, note, unitPrice) {
  db.movements.unshift({
    id: uid('mv'), at: new Date().toISOString(),
    productId, variantId, type, qty: Number(qty),
    reason: reason || '', note: note || '', unitPrice: Number(unitPrice || 0)
  });
  if (db.movements.length > 4000) db.movements.length = 4000;
}

/* type: 'in' adds stock, 'out' removes stock, 'set' overwrites the number */
function changeStock(productId, variantId, type, qty, reason, note, unitPrice) {
  const p = findProduct(productId);
  const v = findVariant(p, variantId);
  if (!p || !v) return false;
  const q = Number(qty);
  if (type === 'in')  v.qty = Number(v.qty || 0) + q;
  if (type === 'out') v.qty = Math.max(0, Number(v.qty || 0) - q);
  if (type === 'set') v.qty = Math.max(0, q);
  recordMovement(productId, variantId, type, q, reason, note, unitPrice);
  return true;
}

function wireOnboarding() {
  const w = ui.wizard;

  const readStep1 = () => {
    if ($('#wBrand'))    w.brandName = $('#wBrand').value.trim();
    if ($('#wCurrency')) w.currency  = $('#wCurrency').value;
    if ($('#wLow'))      w.lowStock  = Math.max(0, Number($('#wLow').value || 0));
  };
  const readStep2 = () => {
    if (!$$('.wCat').length) return;
    const checked = $$('.wCat').filter(c => c.checked).map(c => c.value);
    const custom  = w.categories.filter(c => !DEFAULT_CATEGORIES.includes(c));
    w.categories = checked.concat(custom);
  };

  $$('[data-w]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.w, val = btn.dataset.val;

      if (act === 'next') {
        if (w.step === 1) {
          readStep1();
          if (!w.brandName) { toast('Please type your brand name.', 'error'); return; }
        }
        if (w.step === 2) {
          readStep2();
          if (!w.categories.length) { toast('Pick at least one product type.', 'error'); return; }
        }
        if (w.step === 3 && (!w.sizes.length || !w.colors.length)) {
          toast('Please keep at least one size and one colour.', 'error'); return;
        }
        w.step++;
      }
      else if (act === 'back') { if (w.step === 2) readStep2(); w.step--; }
      else if (act === 'addcat') {
        readStep2();
        const v = $('#wNewCat').value.trim();
        if (v && !w.categories.some(c => c.toLowerCase() === v.toLowerCase())) w.categories.push(v);
      }
      else if (act === 'delcat')  { readStep2(); w.categories = w.categories.filter(c => c !== val); }
      else if (act === 'addsize') { const v = $('#wNewsize').value.trim().toUpperCase();
                                    if (v && !w.sizes.includes(v)) w.sizes.push(v); }
      else if (act === 'delsize') { w.sizes = w.sizes.filter(s => s !== val); }
      else if (act === 'addcolor'){ const v = $('#wNewcolor').value.trim();
                                    if (v && !w.colors.some(c => c.toLowerCase() === v.toLowerCase())) w.colors.push(v); }
      else if (act === 'delcolor'){ w.colors = w.colors.filter(c => c !== val); }
      else if (act === 'addprod') {
        const name = $('#wpName').value.trim();
        if (!name) { toast('Type a product name first.', 'error'); return; }
        w.products.push({
          name, category: $('#wpCat').value,
          qty:   Math.max(0, Number($('#wpQty').value || 0)),
          cost:  Math.max(0, Number($('#wpCost').value || 0)),
          price: Math.max(0, Number($('#wpPrice').value || 0))
        });
        toast(name + ' added.');
      }
      else if (act === 'delprod') { w.products.splice(Number(val), 1); }
      else if (act === 'finish')  { finishWizard(); return; }

      render();
    };
  });

  const enterAdds = { '#wNewCat': 'addcat', '#wNewsize': 'addsize', '#wNewcolor': 'addcolor', '#wpName': null };
  Object.keys(enterAdds).forEach(sel => {
    const el = $(sel); if (!el || !enterAdds[sel]) return;
    el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $(`[data-w="${enterAdds[sel]}"]`).click(); } };
  });
}

function finishWizard() {
  const w = ui.wizard;
  const cur = CURRENCIES.find(c => c.code === w.currency) || CURRENCIES[0];

  db.brand = { name: w.brandName || BRAND_NAME, currency: cur.code, symbol: cur.symbol, lowStock: Number(w.lowStock) || 0 };
  db.categories = w.categories.slice();
  db.sizes  = w.sizes.slice();
  db.colors = w.colors.slice();

  w.products.forEach(wp => {
    const p = {
      id: uid('p'), name: wp.name, category: wp.category,
      cost: wp.cost, price: wp.price, lowStock: '', supplier: '', notes: '',
      sizes: db.sizes.slice(), colors: db.colors.slice(), variants: [], createdAt: new Date().toISOString()
    };
    p.variants = buildVariants(p);
    if (wp.qty > 0) p.variants.forEach(v => {
      v.qty = wp.qty;
      recordMovement(p.id, v.id, 'in', wp.qty, 'Opening stock', 'Added during setup', wp.cost);
    });
    db.products.push(p);
  });

  db.onboarded = true;
  ui.wizard = null;
  ui.tab = 'dashboard';
  save();
  render();
  toast('Setup complete. Welcome!', 'ok');
}

      ${card('Sales this month', money(monthSales.revenue), pieces(monthSales.units) + ' sold')}
      ${card('Profit this month', money(monthSales.profit), num(monthSales.count) + ' orders')}
    </div>

    <div class="grid lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl border border-ink-200 p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Needs your attention</h3>

        </div>
        ${lowList.length ? `

          ${lowList.slice(0, 8).map(({ p, st }) => `
            <div class="flex items-center gap-3 py-2">

        ` : `<div class="text-sm text-ink-500 py-6 text-center">Everything is well stocked. 👍</div>`}
      </div>

        <h3 class="font-semibold mb-3">Stock by product type</h3>

}

function viewReports() {
  const t = totals();

  const lowList = db.products.filter(p => stockState(p) !== 'ok')
    .sort((a, b) => productStock(a) - productStock(b));

  /* best sellers, all time */
  const sold = {};
  db.sales.forEach(s => s.lines.forEach(l => {
    sold[l.productId] = sold[l.productId] || { qty: 0, revenue: 0, profit: 0 };
    sold[l.productId].qty     += Number(l.qty || 0);
    sold[l.productId].revenue += Number(l.qty || 0) * Number(l.price || 0);
    sold[l.productId].profit  += Number(l.qty || 0) * (Number(l.price || 0) - Number(l.cost || 0));
  }));
  const best = Object.entries(sold)
    .map(([id, v]) => ({ p: findProduct(id), ...v }))
    .filter(x => x.p)
    .sort((a, b) => b.qty - a.qty);

  const byCat = {};
  db.products.forEach(p => {
    byCat[p.category] = byCat[p.category] || { products: 0, units: 0, cost: 0, retail: 0 };
    byCat[p.category].products++;

    <div class="bg-white rounded-xl border border-ink-200 p-4">

      ${lowList.length ? `

function openModal(html, wire, size = 'max-w-2xl') {
  $('#modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-black/40 z-40 flex items-start justify-center p-4 overflow-y-auto" data-modal-bg>
      <div class="bg-white rounded-2xl shadow-xl w-full ${size} my-6">${html}</div>
    </div>`;
  const bg = $('[data-modal-bg]');
  bg.onclick = e => { if (e.target === bg) closeModal(); };
  document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };
  $$('[data-close]').forEach(b => b.onclick = closeModal);
  if (wire) wire();
}

function closeModal() {
  $('#modalRoot').innerHTML = '';
  document.onkeydown = null;
}

function modalHead(title, subtitle) {
  return `
  <div class="flex items-start gap-3 border-b border-ink-200 px-5 py-4">
    <div class="flex-1">
      <h3 class="text-lg font-semibold">${esc(title)}</h3>
      ${subtitle ? `<p class="text-sm text-ink-500">${esc(subtitle)}</p>` : ''}
    </div>
    <button data-close class="text-ink-400 hover:text-ink-800 text-2xl leading-none">&times;</button>
  </div>`;
}

function openProductModal(id) {
  const editing = !!id;
  const p = editing ? findProduct(id) : {
    id: '', name: '', category: db.categories[0] || '', cost: 0, price: 0,
    lowStock: '', supplier: '', notes: '',
    sizes: db.sizes.slice(), colors: db.colors.slice(), variants: []
  };
  if (!p) return;

  openModal(`
    ${modalHead(editing ? 'Edit product' : 'New product',

    <div class="p-5 grid gap-4">
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Product name *</label>
          <input id="mName" value="${esc(p.name)}" placeholder="e.g. Winter Bike Jacket"
            class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Product type</label>
          <select id="mCat" class="w-full border border-ink-300 rounded-lg px-3 py-2">
            ${db.categories.map(c => `<option ${c === p.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Supplier / tailor (optional)</label>
          <input id="mSupplier" value="${esc(p.supplier || '')}" class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Cost price (${esc(db.brand.symbol)})</label>
          <input id="mCost" type="number" min="0" step="0.01" value="${Number(p.cost || 0)}"
            class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Selling price (${esc(db.brand.symbol)})</label>
          <input id="mPrice" type="number" min="0" step="0.01" value="${Number(p.price || 0)}"
            class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Low-stock warning (optional)</label>
          <input id="mLow" type="number" min="0" value="${esc(p.lowStock)}" placeholder="Default: ${esc(db.brand.lowStock)}"
            class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Notes (optional)</label>
          <input id="mNotes" value="${esc(p.notes || '')}" class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Sizes for this product</label>
        <div class="flex flex-wrap gap-2">
          ${db.sizes.map(s => `
            <label class="inline-flex items-center gap-2 border border-ink-300 rounded-lg px-3 py-1.5 cursor-pointer hover:bg-ink-50">
              <input type="checkbox" class="mSize" value="${esc(s)}" ${p.sizes.includes(s) ? 'checked' : ''}>
              <span class="text-sm">${esc(s)}</span>
            </label>`).join('')}
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Colours for this product</label>
        <div class="flex flex-wrap gap-2">
          ${db.colors.map(c => `
            <label class="inline-flex items-center gap-2 border border-ink-300 rounded-lg px-3 py-1.5 cursor-pointer hover:bg-ink-50">
              <input type="checkbox" class="mColor" value="${esc(c)}" ${p.colors.includes(c) ? 'checked' : ''}>
              <span class="text-sm">${esc(c)}</span>
            </label>`).join('')}
        </div>
      </div>

      ${editing ? '' : `
      <div class="bg-ink-50 border border-ink-200 rounded-lg p-3">
        <label class="block text-sm font-medium mb-1">Starting stock for each size &amp; colour</label>
        <input id="mStart" type="number" min="0" value="0" class="w-32 border border-ink-300 rounded-lg px-3 py-2">
        <span class="text-xs text-ink-500 ml-2">Leave 0 if you will add stock later.</span>
      </div>`}
    </div>

    <div class="flex justify-end gap-2 border-t border-ink-200 px-5 py-4">
      <button data-close class="px-4 py-2 rounded-lg border border-ink-300 hover:bg-ink-50">Cancel</button>
      <button id="mSave" class="px-5 py-2 rounded-lg bg-brandc-600 hover:bg-brandc-700 text-white font-medium">
        ${editing ? 'Save changes' : 'Create product'}
      </button>
    </div>`, () => {

    $('#mSave').onclick = () => {
      const name = $('#mName').value.trim();
      if (!name) { toast('Please type a product name.', 'error'); return; }
      const sizes  = $$('.mSize').filter(c => c.checked).map(c => c.value);
      const colors = $$('.mColor').filter(c => c.checked).map(c => c.value);
      if (!sizes.length)  { toast('Pick at least one size.', 'error'); return; }
      if (!colors.length) { toast('Pick at least one colour.', 'error'); return; }

      const data = {
        name,
        category: $('#mCat').value,
        supplier: $('#mSupplier').value.trim(),
        notes:    $('#mNotes').value.trim(),
        cost:     Math.max(0, Number($('#mCost').value || 0)),
        price:    Math.max(0, Number($('#mPrice').value || 0)),
        lowStock: $('#mLow').value === '' ? '' : Math.max(0, Number($('#mLow').value)),
        sizes, colors
      };

      if (editing) {
        const target = findProduct(id);

        /* Warn before dropping a size or colour that still holds stock. */
        const keeping = new Set();
        sizes.forEach(sz => colors.forEach(cl => keeping.add(sz + '||' + cl)));
        const losing = target.variants.filter(v => !keeping.has(v.size + '||' + v.color) && Number(v.qty) > 0);
        if (losing.length) {
          const lost = losing.reduce((a, v) => a + Number(v.qty), 0);
          const list = losing.map(v => `${v.size}/${v.color} (${v.qty})`).join(', ');
          if (!confirm(`You unticked sizes or colours that still hold ${lost} piece${lost === 1 ? '' : 's'}:\n\n${list}\n\nSaving removes them from stock. Continue?`)) return;
          losing.forEach(v => recordMovement(target.id, v.id, 'out', v.qty,
            'Size/colour removed', `${v.size} / ${v.color} deleted from this product`, 0));
        }

        Object.assign(target, data);
        target.variants = buildVariants(target, target.variants);
        toast('Product updated.');
      } else {
        const np = Object.assign({ id: uid('p'), variants: [], createdAt: new Date().toISOString() }, data);
        np.variants = buildVariants(np);
        const start = Math.max(0, Number(($('#mStart') || {}).value || 0));
        if (start > 0) np.variants.forEach(v => {
          v.qty = start;
          recordMovement(np.id, v.id, 'in', start, 'Opening stock', '', np.cost);
        });
        db.products.push(np);
        toast(name + ' created.');
      }
      save(); closeModal(); render();
    };
  });
}

const OUT_REASONS = ['Damaged', 'Returned to supplier', 'Sample / gift', 'Lost', 'Stock correction'];

function openStockModal(type, productId) {
  if (!db.products.length) { toast('Add a product first.', 'error'); return; }
  const pid = productId || db.products[0].id;
  const isIn = type === 'in';

  const body = () => {
    const p = findProduct($('#stProduct') ? $('#stProduct').value : pid) || db.products[0];
    return p.variants.map(v => `
      <tr class="border-t border-ink-100">
        <td class="px-3 py-1.5">${esc(v.size)}</td>
        <td class="px-3 py-1.5">${esc(v.color)}</td>
        <td class="px-3 py-1.5 text-right text-ink-500">${num(v.qty)}</td>
        <td class="px-3 py-1.5 text-center">
          <input type="number" min="0" value="" placeholder="0" data-mv="${v.id}"
            class="w-24 text-center border border-ink-300 rounded-lg px-2 py-1">
        </td>
      </tr>`).join('');
  };

  openModal(`
    ${modalHead(isIn ? 'Stock In — add pieces' : 'Stock Out — remove pieces',
                isIn ? 'Type how many pieces arrived for each size and colour.'
                     : 'Type how many pieces are leaving (not a sale — use Record Sale for that).')}
    <div class="p-5 grid gap-3">
      <div class="grid sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Product</label>
          <select id="stProduct" class="w-full border border-ink-300 rounded-lg px-3 py-2">
            ${db.products.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)} — ${esc(p.category)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Reason</label>
          <select id="stReason" class="w-full border border-ink-300 rounded-lg px-3 py-2">
            ${(isIn ? IN_REASONS : OUT_REASONS).map(r => `<option>${esc(r)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Note (optional)</label>
        <input id="stNote" placeholder="e.g. Invoice 1043 from Al-Karam" class="w-full border border-ink-300 rounded-lg px-3 py-2">
      </div>

      <div class="flex items-center gap-2">
        <input id="stAll" type="number" min="0" placeholder="Same for all" class="w-36 border border-ink-300 rounded-lg px-3 py-2 text-sm">
        <button id="stFill" class="px-3 py-2 rounded-lg bg-ink-800 text-white text-sm">Apply to every row</button>
      </div>

      <div class="overflow-x-auto border border-ink-200 rounded-lg max-h-80 overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="bg-ink-100 text-ink-600 text-xs uppercase sticky top-0">
            <tr><th class="text-left px-3 py-2">Size</th><th class="text-left px-3 py-2">Colour</th>
                <th class="text-right px-3 py-2">Now</th>
                <th class="text-center px-3 py-2">${isIn ? 'Add' : 'Remove'}</th></tr>
          </thead>
          <tbody id="stBody">${body()}</tbody>
        </table>
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t border-ink-200 px-5 py-4">
      <button data-close class="px-4 py-2 rounded-lg border border-ink-300 hover:bg-ink-50">Cancel</button>
      <button id="stSave" class="px-5 py-2 rounded-lg ${isIn ? 'bg-brandc-600 hover:bg-brandc-700' : 'bg-rose-600 hover:bg-rose-700'} text-white font-medium">
        ${isIn ? 'Add to stock' : 'Remove from stock'}
      </button>
    </div>`, () => {

    $('#stProduct').onchange = () => { $('#stBody').innerHTML = body(); };
    $('#stFill').onclick = () => {
      const v = $('#stAll').value;
      $$('[data-mv]').forEach(i => i.value = v);
    };
    $('#stSave').onclick = () => {
      const p = findProduct($('#stProduct').value);
      const reason = $('#stReason').value, note = $('#stNote').value.trim();
      let touched = 0, pieces = 0;
      $$('[data-mv]').forEach(i => {
        const q = Number(i.value || 0);
        if (q > 0) {
          changeStock(p.id, i.dataset.mv, isIn ? 'in' : 'out', q, reason, note, isIn ? p.cost : 0);
          touched++; pieces += q;
        }
      });
      if (!touched) { toast('Type at least one quantity.', 'error'); return; }
      save(); closeModal(); render();
      toast(`${isIn ? 'Added' : 'Removed'} ${pieces} piece${pieces === 1 ? '' : 's'} across ${touched} row${touched === 1 ? '' : 's'}.`);
    };
  }, 'max-w-2xl');
}

/* ---------- 14d. Record a sale ---------- */

let saleDraft = null;

function openSaleModal() {
  if (!db.products.length) { toast('Add a product first.', 'error'); return; }
  saleDraft = { date: todayISO(), customer: '', channel: 'Shop', discount: 0, lines: [] };
  renderSaleModal();
}

function saleLineTotals() {
  let total = 0, cost = 0;
  saleDraft.lines.forEach(l => {
    total += Number(l.qty) * Number(l.price);
    cost  += Number(l.qty) * Number(l.cost);
  });
  const discount = Math.max(0, Number(saleDraft.discount || 0));
  const net = Math.max(0, total - discount);
  return { gross: total, discount, net, cost, profit: net - cost };
}

function saleTotalsHtml() {
  const t = saleLineTotals();
  return `
    <div class="flex justify-between py-0.5"><span>Items total</span><span>${money(t.gross)}</span></div>
    <div class="flex justify-between py-0.5"><span>Discount</span><span>&minus; ${money(t.discount)}</span></div>
    <div class="flex justify-between py-1 border-t border-ink-200 font-semibold text-base">
      <span>To pay</span><span>${money(t.net)}</span></div>
    <div class="flex justify-between py-0.5 text-emerald-700"><span>Your profit</span><span>${money(t.profit)}</span></div>`;
}

function renderSaleModal() {
  const firstProduct = db.products[0];

  openModal(`
    ${modalHead('Record a sale', 'Stock is reduced automatically when you save.')}
    <div class="p-5 grid gap-4">
      <div class="grid sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Date</label>
          <input id="slDate" type="date" value="${esc(saleDraft.date)}" class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Customer (optional)</label>
          <input id="slCustomer" value="${esc(saleDraft.customer)}" placeholder="Walk-in" class="w-full border border-ink-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Where</label>
          <select id="slChannel" class="w-full border border-ink-300 rounded-lg px-3 py-2">
            ${['Shop', 'Instagram', 'WhatsApp', 'Website', 'Exhibition', 'Wholesale', 'Other']
              .map(c => `<option ${c === saleDraft.channel ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="border border-ink-200 rounded-lg p-3 bg-ink-50">
        <div class="grid sm:grid-cols-12 gap-2 items-end">
          <div class="sm:col-span-5">
            <label class="block text-xs font-medium mb-1">Product</label>
            <select id="slProduct" class="w-full border border-ink-300 rounded-lg px-2 py-2 bg-white text-sm">
              ${db.products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
            </select>
          </div>
          <div class="sm:col-span-3">
            <label class="block text-xs font-medium mb-1">Size / colour</label>
            <select id="slVariant" class="w-full border border-ink-300 rounded-lg px-2 py-2 bg-white text-sm">
              ${variantOptions(firstProduct)}
            </select>
          </div>
          <div class="sm:col-span-1">
            <label class="block text-xs font-medium mb-1">Qty</label>
            <input id="slQty" type="number" min="1" value="1" class="w-full border border-ink-300 rounded-lg px-2 py-2 bg-white text-sm">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium mb-1">Price each</label>
            <input id="slPrice" type="number" min="0" step="0.01" value="${Number(firstProduct.price || 0)}"
              class="w-full border border-ink-300 rounded-lg px-2 py-2 bg-white text-sm">
          </div>
          <div class="sm:col-span-1">
            <button id="slAdd" class="w-full px-3 py-2 rounded-lg bg-ink-800 text-white text-sm">Add</button>

        </div>
      </div>

      ${saleDraft.lines.length ? `
      <div class="border border-ink-200 rounded-lg overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-ink-100 text-ink-600 text-xs uppercase">
            <tr><th class="text-left px-3 py-2">Item</th><th class="text-right px-3 py-2">Qty</th>
                <th class="text-right px-3 py-2">Price</th><th class="text-right px-3 py-2">Line total</th><th></th></tr>
          </thead>
          <tbody>
            ${saleDraft.lines.map((l, i) => {

              return `

                <td class="px-3 py-2 text-right">${num(l.qty)}</td>
                <td class="px-3 py-2 text-right">${money(l.price)}</td>
                <td class="px-3 py-2 text-right font-medium">${money(l.qty * l.price)}</td>

      <div class="grid sm:grid-cols-2 gap-3 items-start">

      <button id="slSave" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium">Save sale</button>
    </div>`, wireSaleModal, 'max-w-3xl');
}

function variantOptions(p) {
  if (!p) return '';
  return p.variants.map(v =>
    `<option value="${v.id}">${esc(v.size + ' / ' + v.color)} (${num(v.qty)} left)</option>`).join('');
}

function keepSaleHeader() {
  if (!$('#slDate')) return;
  saleDraft.date     = $('#slDate').value || todayISO();
  saleDraft.customer = $('#slCustomer').value.trim();
  saleDraft.channel  = $('#slChannel').value;
  saleDraft.discount = Math.max(0, Number($('#slDiscount').value || 0));
}

function wireSaleModal() {
  const prodSel = $('#slProduct');

  prodSel.onchange = () => {
    const p = findProduct(prodSel.value);
    $('#slVariant').innerHTML = variantOptions(p);
    $('#slPrice').value = Number(p.price || 0);
  };

  $('#slAdd').onclick = () => {
    keepSaleHeader();
    const p = findProduct(prodSel.value);
    const v = findVariant(p, $('#slVariant').value);
    const qty = Math.max(1, Number($('#slQty').value || 1));
    const price = Math.max(0, Number($('#slPrice').value || 0));
    if (!p || !v) return;

    const already = saleDraft.lines
      .filter(l => l.variantId === v.id)
      .reduce((a, l) => a + Number(l.qty), 0);
    if (qty + already > Number(v.qty)) {
      toast(`Only ${v.qty} left of ${p.name} ${v.size}/${v.color}.`, 'error');
      return;
    }

    const existing = saleDraft.lines.find(l => l.variantId === v.id && Number(l.price) === price);
    if (existing) existing.qty = Number(existing.qty) + qty;
    else saleDraft.lines.push({ productId: p.id, variantId: v.id, qty, price, cost: Number(p.cost || 0) });
    renderSaleModal();
  };

  $$('[data-delline]').forEach(b => b.onclick = () => {
    keepSaleHeader();
    saleDraft.lines.splice(Number(b.dataset.delline), 1);
    renderSaleModal();
  });

  /* update the totals as they type — rebuilding the whole modal here would
     swallow the very next click on "Save sale" */
  $('#slDiscount').oninput = () => {
    saleDraft.discount = Math.max(0, Number($('#slDiscount').value || 0));
    $('#slTotals').innerHTML = saleTotalsHtml();
  };

  $('#slSave').onclick = () => {
    keepSaleHeader();
    if (!saleDraft.lines.length) { toast('Add at least one item.', 'error'); return; }
    const t = saleLineTotals();

    db.counters.sale = (db.counters.sale || 0) + 1;
    const ref = 'S-' + String(db.counters.sale).padStart(4, '0');

    saleDraft.lines.forEach(l => {
      changeStock(l.productId, l.variantId, 'out', l.qty, 'Sale ' + ref, saleDraft.customer, l.price);
    });

    db.sales.unshift({
      id: uid('s'), ref,
      date: saleDraft.date + 'T' + new Date().toTimeString().slice(0, 8),
      customer: saleDraft.customer, channel: saleDraft.channel,
      lines: saleDraft.lines.slice(), discount: t.discount,
      total: t.net, cost: t.cost, profit: t.profit
    });

    save(); closeModal(); saleDraft = null;
    ui.tab = 'sales'; render();
    toast('Sale ' + ref + ' saved — ' + money(t.net));
  };
}

function undoSale(id) {
  const i = db.sales.findIndex(s => s.id === id);
  if (i < 0) return;
  const s = db.sales[i];
  if (!confirm(`Undo sale ${s.ref} (${money(s.total)})?\nThe pieces go back into stock.`)) return;
  s.lines.forEach(l => changeStock(l.productId, l.variantId, 'in', l.qty, 'Sale undone ' + s.ref, '', l.cost));
  db.sales.splice(i, 1);
  save(); render();
  toast('Sale ' + s.ref + ' undone.');
}

/* ============================================================
   15. CSV EXPORT + BACKUP
   ============================================================ */

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadFile(name, text, mime = 'text/csv;charset=utf-8') {
  const blob = new Blob(['﻿' + text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function stamp() { return new Date().toISOString().slice(0, 10); }

function exportProductsCsv() {
  const rows = [['Product', 'Type', 'Supplier', 'Cost', 'Price', 'In stock', 'Stock value', 'Status']];
  filteredProducts().forEach(p => rows.push([
    p.name, p.category, p.supplier || '', p.cost, p.price,
    productStock(p), productValue(p),
    stockState(p) === 'ok' ? 'In stock' : stockState(p) === 'low' ? 'Low' : 'Out of stock'
  ]));
  downloadFile('products-' + stamp() + '.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'));
  toast('Products exported.');
}

function exportStockCsv() {
  const rows = [['Product', 'Type', 'Size', 'Colour', 'SKU', 'Qty', 'Cost', 'Price', 'Stock value']];
  db.products.forEach(p => p.variants.forEach(v => rows.push([
    p.name, p.category, v.size, v.color, v.sku, v.qty, p.cost, p.price, Number(v.qty) * Number(p.cost || 0)
  ])));
  downloadFile('stock-list-' + stamp() + '.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'));
  toast('Stock list exported.');
}

function exportLowCsv() {
  const rows = [['Product', 'Type', 'Supplier', 'Pieces left', 'Warn at', 'Status']];
  db.products.filter(p => stockState(p) !== 'ok')
    .sort((a, b) => productStock(a) - productStock(b))
    .forEach(p => rows.push([p.name, p.category, p.supplier || '', productStock(p), lowLimit(p),
      stockState(p) === 'out' ? 'Out of stock' : 'Low']));
  downloadFile('reorder-list-' + stamp() + '.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'));
  toast('Re-order list exported.');
}

function exportSalesCsv() {
  const rows = [['Order', 'Date', 'Customer', 'Where', 'Product', 'Size', 'Colour', 'Qty', 'Price each', 'Line total']];
  salesBetween(ui.salesFrom, ui.salesTo).forEach(s => s.lines.forEach(l => {
    const p = findProduct(l.productId), v = findVariant(p, l.variantId);
    rows.push([s.ref, s.date.slice(0, 10), s.customer || '', s.channel || '',
      p ? p.name : '', v ? v.size : '', v ? v.color : '', l.qty, l.price, Number(l.qty) * Number(l.price)]);
  }));
  downloadFile('sales-' + stamp() + '.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'));
  toast('Sales exported.');
}

function backup() {
  downloadFile('inventory-backup-' + stamp() + '.json', JSON.stringify(db, null, 2), 'application/json');
  toast('Backup downloaded. Keep it somewhere safe.');
}

function restoreFrom(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.products)) throw new Error('not an inventory backup');
      if (!confirm('This replaces everything currently on this screen with the backup file. Continue?')) return;
      db = data;
      const base = blankDb();                       // fill in anything an older backup is missing
      for (const k in base)       if (!(k in db))       db[k] = base[k];
      for (const k in base.brand) if (!(k in db.brand)) db.brand[k] = base.brand[k];
      save();
      ui.tab = 'dashboard';
      render();
      toast('Backup restored.');
    } catch (e) {
      toast('That file is not a valid inventory backup.', 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   16. WIRING THE BUTTONS ON EACH TAB
   ============================================================ */

function qtyCellClass(p, v) {
  const q = Number(v.qty || 0);
  const base = 'w-20 text-center border rounded-lg px-2 py-1 ';
  if (q <= 0) return base + 'border-rose-300 bg-rose-50 text-rose-700';
  if (q <= lowLimit(p)) return base + 'border-amber-300 bg-amber-50 text-amber-800';
  return base + 'border-ink-300';
}

/* Update one quantity box where it stands. Re-drawing the whole page here would
   re-sort the rows under the user's finger and swallow their next click. */
function refreshQtyCell(pid, vid) {
  const p = findProduct(pid), v = findVariant(p, vid);
  const inp = document.querySelector(`[data-setqty="${pid}|${vid}"]`);
  if (!p || !v || !inp) return;
  inp.value = Number(v.qty);
  inp.className = qtyCellClass(p, v);
}

function wireQtyInputs() {
  $$('[data-setqty]').forEach(inp => {
    inp.onchange = () => {
      const [pid, vid] = inp.dataset.setqty.split('|');
      const p = findProduct(pid), v = findVariant(p, vid);
      if (!p || !v) return;
      const before = Number(v.qty || 0);
      const after  = Math.max(0, Number(inp.value || 0));
      if (before === after) { inp.value = before; return; }
      changeStock(pid, vid, 'set', after, 'Manual correction', `Changed from ${before} to ${after}`, 0);
      save();
      refreshQtyCell(pid, vid);
      toast(`${p.name} ${v.size}/${v.color} set to ${after}.`);
    };
  });

  $$('[data-step]').forEach(btn => {
    btn.onclick = () => {
      const [pid, vid, delta] = btn.dataset.step.split('|');
      const d = Number(delta);
      const v = findVariant(findProduct(pid), vid);
      if (!v) return;
      if (d < 0 && Number(v.qty) <= 0) return;
      changeStock(pid, vid, d > 0 ? 'in' : 'out', Math.abs(d), 'Quick change', '', 0);
      save();
      refreshQtyCell(pid, vid);
    };
  });
}

function wireTab() {
  wireQtyInputs();

  /* generic buttons that exist on several tabs */
  const acts = {
    'go-products':      () => { ui.tab = 'products'; render(); },
    'new-product':      () => openProductModal(),
    'quick-sale2':      () => openSaleModal(),
    'quick-in2':        () => openStockModal('in'),
    'quick-out':        () => openStockModal('out'),
    'export-products':  exportProductsCsv,
    'export-stock':     exportStockCsv,
    'export-low':       exportLowCsv,
    'export-sales':     exportSalesCsv,
    'print':            () => window.print(),
    'backup':           backup,
    'restore':          () => $('#restoreFile').click(),
    'sales-clear':      () => { ui.salesFrom = ''; ui.salesTo = ''; render(); },
    'sales-today':      () => { ui.salesFrom = ui.salesTo = todayISO(); render(); },
    'sales-month':      () => { ui.salesFrom = todayISO().slice(0, 8) + '01'; ui.salesTo = todayISO(); render(); },
    'wipe':             wipeEverything,
    'save-brand':       saveBrandSettings
  };
  $$('[data-act]').forEach(btn => {
    const fn = acts[btn.dataset.act];
    if (fn) { btn.onclick = fn; return; }
    if (btn.dataset.act === 'open-product') btn.onclick = () => openProductDetail(btn.dataset.id);
    if (btn.dataset.act === 'edit-product') btn.onclick = () => openProductModal(btn.dataset.id);
    if (btn.dataset.act === 'del-product')  btn.onclick = () => deleteProduct(btn.dataset.id);
    if (btn.dataset.act === 'restock')      btn.onclick = () => openStockModal('in', btn.dataset.id);
    if (btn.dataset.act === 'undo-sale')    btn.onclick = () => undoSale(btn.dataset.id);
  });

  /* search + filter boxes keep the cursor where it was */
  keepTyping($('#pSearch'), v => { ui.productSearch = v; });
  if ($('#pCat'))    $('#pCat').onchange    = e => { ui.productCategory = e.target.value; render(); };
  if ($('#pStatus')) $('#pStatus').onchange = e => { ui.productStatus = e.target.value; render(); };

  keepTyping($('#sSearch'), v => { ui.stockSearch = v; });
  if ($('#sFrom')) $('#sFrom').onchange = e => { ui.salesFrom = e.target.value; render(); };
  if ($('#sTo'))   $('#sTo').onchange   = e => { ui.salesTo   = e.target.value; render(); };

  const rf = $('#restoreFile');
  if (rf) rf.onchange = () => { if (rf.files[0]) restoreFrom(rf.files[0]); };

  /* settings chips */
  $$('[data-set]').forEach(btn => {
    btn.onclick = () => {
      const [action, kind] = btn.dataset.set.split('-');
      const listName = kind === 'cat' ? 'categories' : kind === 'size' ? 'sizes' : 'colors';
      if (action === 'add') {
        const input = $('#set-new-' + kind);
        let v = input.value.trim();
        if (kind === 'size') v = v.toUpperCase();
        if (!v) return;
        if (db[listName].some(x => String(x).toLowerCase() === v.toLowerCase())) { toast('That is already in the list.', 'error'); return; }
        db[listName].push(v);
      } else {
        const val = btn.dataset.val;
        if (kind === 'cat' && db.products.some(p => p.category === val)) {
          toast('Some products still use this type. Change them first.', 'error'); return;
        }
        db[listName] = db[listName].filter(x => x !== val);
      }
      save(); render();
    };
  });
}

/* Re-drawing the page while someone types would move their cursor to the end,
   so put it back exactly where it was. */
function keepTyping(input, apply) {
  if (!input) return;
  const id = '#' + input.id;
  input.oninput = debounce(() => {
    const caret = input.selectionStart;
    apply(input.value);
    render();
    const again = $(id);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (e) {} }
  }, 250);
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function deleteProduct(id) {
  const p = findProduct(id);
  if (!p) return;
  if (!confirm(`Delete "${p.name}"?\n\nIts ${num(productStock(p))} pieces in stock and its history will be removed.\nThis cannot be undone.`)) return;
  db.products = db.products.filter(x => x.id !== id);
  db.movements = db.movements.filter(m => m.productId !== id);
  save(); render();
  toast(p.name + ' deleted.');
}

function saveBrandSettings() {
  const cur = CURRENCIES.find(c => c.code === $('#setCurrency').value) || CURRENCIES[0];
  db.brand.name     = $('#setName').value.trim() || BRAND_NAME;
  db.brand.currency = cur.code;
  db.brand.symbol   = cur.symbol;
  db.brand.lowStock = Math.max(0, Number($('#setLow').value || 0));
  save(); render();
  toast('Settings saved.');
}

function wipeEverything() {
  if (!confirm('This deletes ALL products, stock and sales on this device.\n\nAre you sure?')) return;
  if (!confirm('Really erase everything? Download a backup first if you are not sure.')) return;
  localStorage.removeItem(STORAGE_KEY);
  db = blankDb();
  ui.tab = 'dashboard';
  ui.wizard = null;
  render();
  toast('Everything erased. Setup starts again.');
}

window.addEventListener('DOMContentLoaded', () => {
  load();
  render();
});
</script>
