<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Parts — Muskan Confessionary</title>
<meta name="description" content="Browse 40+ genuine motorbike spare parts — engine, brakes, electricals, suspension, tyres and more. Add to cart and check out with JazzCash, EasyPaisa or Cash on Delivery." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f2a4a'/%3E%3Cpath fill='%23ff7a1a' d='M14.7 6.3a4 4 0 0 0-5.4 4.9L3 17.5 5.5 20l6.3-6.3a4 4 0 0 0 4.9-5.4l-2.6 2.6-2-2 2.6-2.6z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="container">
    <div class="topbar-item">📍 Al Hammad Plaza, Shop No 16, Sector 5B2, North Karachi Central, Karachi</div>
    <a class="topbar-item" href="tel:+923120215642">📞 0312-0215642</a>
  </div>
</div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark" id="icon-wrenchBadge"></span>
      <span class="brand-text">
        <span class="name">Muskan Confessionary</span>
        <span class="tag">Bike Spare Parts</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="tel:+923120215642" aria-label="Call us" id="icon-phone-btn"></a>
      <button class="icon-btn" data-open-cart aria-label="Open cart" id="icon-cart-btn">
        <span class="cart-badge">0</span>
      </button>
      <button class="hamburger" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Shop</div>
    <h1>Shop All Spare Parts</h1>
  </div>
</section>

<main>
  <section class="section-tight">
    <div class="container">
      <div class="toolbar">
        <div class="filter-chips" id="filter-chips"></div>
        <div class="toolbar-right">
          <div class="search-wrap">
            <span id="icon-search"></span>
            <input type="text" id="search-input" class="search-input" placeholder="Search parts..." />
          </div>
          <select id="sort-select" class="select">
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>
      <p id="result-count" class="hint" style="margin-bottom:20px;"></p>
      <div class="product-grid" id="shop-grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div class="overlay" data-close-cart></div>
<aside class="cart-drawer">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button class="cart-close" data-close-cart id="icon-close-btn"></button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-foot" style="display:none;">
    <div class="cart-subtotal"><span>Subtotal</span><span class="cart-subtotal-amount">Rs 0</span></div>
    <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
  </div>
</aside>

<script src="js/icons.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const s = document.getElementById("icon-search");
    if (s) s.innerHTML = icon("search");
  });
</script>
</body>
</html>
