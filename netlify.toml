# Netlify builds the Framewright video editor (video-editor/) as a static site.
# The Node service at the repository root is not deployed by Netlify.
[build]
  base    = "video-editor"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright is a devDependency used only for E2E tests; skip its browser download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
