name: globex-customer-intelligence

on:
  push:
    paths:
      - "globex-customer-intelligence/**"
      - ".github/workflows/globex-customer-intelligence.yml"
  pull_request:
    paths:
      - "globex-customer-intelligence/**"
      - ".github/workflows/globex-customer-intelligence.yml"

defaults:
  run:
    working-directory: globex-customer-intelligence

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gci
          POSTGRES_PASSWORD: gci
          POSTGRES_DB: gci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gci -d gci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://gci:gci@localhost:5432/gci_test
      TEST_DATABASE_URL: postgresql+psycopg://gci:gci@localhost:5432/gci_test
      MLFLOW_TRACKING_URI: /tmp/mlruns
      MODEL_STORE_DIR: /tmp/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: globex-customer-intelligence/backend/requirements-dev.txt
      - name: Install
        working-directory: globex-customer-intelligence/backend
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        working-directory: globex-customer-intelligence/backend
        run: ruff check .
      - name: Migrations apply cleanly
        working-directory: globex-customer-intelligence/backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        working-directory: globex-customer-intelligence/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: globex-customer-intelligence/frontend/package-lock.json
      - name: Install
        working-directory: globex-customer-intelligence/frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: globex-customer-intelligence/frontend
        run: npm run build
      - name: Tests
        working-directory: globex-customer-intelligence/frontend
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./globex-customer-intelligence/backend
      - name: Build frontend image
        run: docker build ./globex-customer-intelligence/frontend
