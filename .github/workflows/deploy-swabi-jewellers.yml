name: Deploy Swabi Jewellers storefront

# Builds swabi-jewellers/ and publishes the static site to GitHub Pages
# (served from the gh-pages branch at https://deeraf-hub.github.io/Fareed-Zafar/).

on:
  push:
    branches:
      - claude/swabi-jewellers-ecommerce-572b3l
    paths:
      - 'swabi-jewellers/**'
      - '.github/workflows/deploy-swabi-jewellers.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: swabi-jewellers-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: swabi-jewellers/package-lock.json

      - name: Install dependencies
        working-directory: swabi-jewellers
        run: npm ci

      - name: Build
        working-directory: swabi-jewellers
        env:
          BASE_PATH: /Fareed-Zafar/
        run: npm run build

      - name: Prepare static output
        working-directory: swabi-jewellers
        run: |
          # GitHub Pages has no rewrite rules: serving index.html as the 404 page
          # lets client-side routes such as /shop/necklaces resolve on a hard refresh.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: swabi-jewellers/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy storefront from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Enable GitHub Pages on the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: creates the Pages site on first run, updates the source afterwards.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f 'source[branch]=gh-pages' -f 'source[path]=/' \
          || gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f 'source[branch]=gh-pages' -f 'source[path]=/' \
          || echo "::warning::Could not enable Pages automatically — enable it under Settings → Pages (source: gh-pages branch, / root)."

      - name: Summary
        run: echo "Site will be live at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
