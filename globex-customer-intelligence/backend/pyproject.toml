[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globex-customer-intelligence"
version = "0.1.0"
description = "E-commerce customer analytics, segmentation and 30-day purchase models (FastAPI + scikit-learn + PostgreSQL)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
gci = "gci.cli:app"

[tool.setuptools]
packages = { find = { include = ["gci*"] } }

[tool.setuptools.package-data]
"gci.api" = ["sql/*.sql"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
