<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist, hiring console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F2F5F3; --surface:#FFFFFF;
  --text:#1C2521; --text2:#5A6661;
  --pine:#1D5E4A; --pine-h:#164437;
  --line:#DDE3E0;
  --wait:#C07A1E; --sched:#2E6DA4; --fwd:#1D5E4A; --drop:#9B3B3B; --stale:#7A7F7C;
  --nav:216px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--text);
  font-family:"Instrument Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:26px;letter-spacing:-0.02em}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0 0 10px}
a{color:var(--pine);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:-0.01em;color:var(--text2)}
.sec{color:var(--text2)}
.num{font-variant-numeric:tabular-nums}
.prose{max-width:66ch}

/* buttons */
.btn{background:var(--pine);color:#fff;border:1px solid var(--pine);padding:7px 13px;border-radius:3px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--pine-h);border-color:var(--pine-h)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--canvas);border-color:var(--text2)}
.btn.danger{background:transparent;color:var(--drop);border-color:var(--drop)}
.btn.danger:hover{background:var(--drop);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--pine);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}

/* shell */
.app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;letter-spacing:-0.03em;font-size:16px;padding:0 8px 14px}
.nav a.item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:3px;color:var(--text);font-weight:500}
.nav a.item:hover{background:var(--canvas);text-decoration:none}
.nav a.item[aria-current="page"]{background:var(--canvas);color:var(--pine)}
.nav .grp{font-size:11px;color:var(--text2);padding:14px 8px 4px;font-weight:600}
.nav .who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;color:var(--text2);font-size:12px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--canvas);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px}
.top .crumb{font-weight:600;font-size:15px}
.kbd{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:2px 6px;font-size:11px;color:var(--text2)}
.wrap{padding:20px 22px 60px;max-width:1240px}

/* panels + rows */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.panel + .panel{margin-top:16px}
.ph{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ph h2{font-size:13px}
.ph .count{color:var(--text2);font-size:12px}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--canvas)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{color:var(--text2);font-size:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.card .st{white-space:normal;align-items:flex-start}
.card .dot{margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--stale)}
.d-wait{background:var(--wait)} .d-sched{background:var(--sched)} .d-fwd{background:var(--fwd)}
.d-drop{background:var(--drop)} .d-stale{background:var(--stale)}
.bar{border-left:2px solid var(--stale);padding-left:10px}
.b-wait{border-color:var(--wait)} .b-sched{border-color:var(--sched)} .b-fwd{border-color:var(--fwd)}
.b-drop{border-color:var(--drop)} .b-stale{border-color:var(--stale)}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--text2);padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--canvas)}
td.r,th.r{text-align:right}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--text)}

/* forms */
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=date],input[type=email],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
textarea{min-height:74px;resize:vertical;line-height:1.5}
.field{margin-bottom:14px}
.hint{color:var(--text2);font-size:12px;margin-top:4px}
.err{color:var(--drop);font-size:12px;margin-top:4px}
fieldset{border:0;padding:0;margin:0}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{border:1px solid var(--line);border-radius:3px;padding:4px 11px;cursor:pointer;background:var(--surface)}
.scale input{position:absolute;opacity:0;width:0;height:0}
.scale input:checked + span{font-weight:700}
.scale label:has(input:checked){border-color:var(--pine);color:var(--pine)}
.scale label:has(input:focus-visible){outline:2px solid var(--pine);outline-offset:2px}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:4px;width:224px;flex:0 0 224px;display:flex;flex-direction:column}
.col.term{width:168px;flex:0 0 168px}
.col.over{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.colh{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.colh .n{margin-left:auto;color:var(--text2)}
.cards{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:64px}
.card{border:1px solid var(--line);border-radius:3px;padding:9px 10px;background:var(--surface);cursor:grab}
.card:hover{border-color:var(--text2)}
.card.drag{opacity:.4}
.card .nm{font-weight:600}
.card .mt{color:var(--text2);font-size:12px;margin-top:2px}
.card .mv{margin-top:7px;display:none}
.empty{color:var(--text2);padding:14px;text-align:center;font-size:12px}

/* misc blocks */
.kv{display:grid;grid-template-columns:132px 1fr;gap:6px 14px;padding:14px}
.kv dt{color:var(--text2)}
.kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:9px 14px 9px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.tl li:last-child{border-bottom:0}
.tl .when{color:var(--text2);width:96px;flex:0 0 96px;font-size:12px}
.tl .rule{color:var(--text2);font-size:12px;border-left:2px solid var(--line);padding-left:8px;margin-left:-8px}
.note{border-top:1px solid var(--line);padding:11px 14px}
.note:first-child{border-top:0}
.note .meta{color:var(--text2);font-size:12px;margin-bottom:3px}
.chip{border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:12px;white-space:nowrap;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters .field{margin:0;min-width:150px}
.gbar{height:9px;background:var(--canvas);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--pine)}
.funnel{padding:14px}
.funnel .step{display:grid;grid-template-columns:150px 1fr 96px;gap:12px;align-items:center;padding:5px 0}
.slot{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.slot:hover{background:var(--canvas)}
.slot[aria-pressed="true"]{background:var(--canvas);box-shadow:inset 2px 0 0 var(--pine)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.split > div{border-left:1px solid var(--line);padding:14px}
.split > div:first-child{border-left:0}
.cmp{display:grid;grid-template-columns:160px repeat(3,1fr);border-top:1px solid var(--line)}
.cmp > div{padding:8px 12px;border-left:1px solid var(--line)}
.cmp > div:first-child{border-left:0;color:var(--text2)}
.cmp .hd{font-weight:600;color:var(--text)}
.cmp .diverge{box-shadow:inset 2px 0 0 var(--wait)}

/* dialog, toast, palette */
.scrim{position:fixed;inset:0;background:rgba(28,37,33,.34);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:5px;width:100%;max-width:520px}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 16px;font-size:15px}
.pal input:focus{outline:none;border-bottom-color:var(--pine)}
.pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal li button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:3px;cursor:pointer;display:flex;gap:10px;align-items:center}
.pal li[aria-selected="true"] button{background:var(--canvas)}
.pal .kind{margin-left:auto;color:var(--text2);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 15px;border-radius:3px;z-index:60}

/* loading */
.skel{background:var(--line);border-radius:2px;height:11px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.boot{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cover */
.cover{max-width:640px;margin:0 auto;padding:72px 20px 96px}
.cover h1{font-size:38px;margin-bottom:6px}
.cover .lede{font-size:16px;color:var(--text2);margin-bottom:34px}
.cover section{border-top:1px solid var(--line);padding-top:20px;margin-top:28px}
.cover h3{margin-bottom:8px}
.cover .dec{margin-bottom:18px}
.cover .dec .q{font-weight:600}
.cover footer{color:var(--text2);margin-top:34px;border-top:1px solid var(--line);padding-top:16px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}
  .nav .grp,.nav .who{display:none}
  .brand{padding:0 8px 0;align-self:center}
  .cols2,.cols3,.split{grid-template-columns:1fr}
  .split > div{border-left:0;border-top:1px solid var(--line)}
  .cmp{grid-template-columns:1fr 1fr}
  .wrap{padding:16px 14px 60px}
  .card{cursor:default}
  .card .mv{display:block}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important}
}
</style>
</head>

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const lpa = n => n == null ? "Not shared" : (Math.round(n*100)%10 === 0 ? n.toFixed(1) : n.toFixed(2)) + " LPA";
const MON = {Jul:6, Aug:7, Sep:8, Oct:9, Nov:10};
function daysAgo(d){
  if(!d) return 999;
  const p = String(d).replace(/^[A-Za-z]{3}\s/,"").split(" ");
  const dt = new Date(2026, MON[p[1]], +p[0]);
  return Math.round((new Date(2026,8,10) - dt) / 86400000);
}
const noticeText = c => typeof c.notice === "number" ? c.notice + " day notice" : c.notice;
function statusOf(c){
  if(c.stage === "dropped") return {cls:"drop", label:"Dropped"};
  if(c.stage === "joined")  return {cls:"fwd",  label:"Joined"};
  if(c.waiting)             return {cls:"wait", label:c.waiting};
  if(daysAgo(c.last) > 7)   return {cls:"stale", label:"No movement in " + daysAgo(c.last) + " days"};
  if(INTERVIEWS.some(i => i.cand === c.id && i.state !== "done")) return {cls:"sched", label:"Interview booked"};
  return {cls:"fwd", label:"Moving forward"};
}
const st = (cls, label) => '<span class="st"><span class="dot d-' + cls + '"></span>' + esc(label) + "</span>";
const link = (href, text, cls) => '<a href="#' + href + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + esc(text) + "</a>";
const candLink = c => link("/candidate/" + c.id, c.name);

function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.innerHTML = ""; }, 3200);
}

  l.innerHTML = '<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="cdt"><div class="modal">' +
    '<div class="mh"><h2 id="cdt">' + esc(o.title) + '</h2></div>' +
    '<div class="mb prose">' + o.body + "</div>" +
    '<div class="mf"><button class="btn ghost" data-act="cancel">Keep in pipeline</button>' +
    '<button class="btn danger" data-act="go">' + esc(o.confirm) + "</button></div></div></div>";
  l.querySelector('[data-act="cancel"]').onclick = closeLayer;
  l.querySelector('[data-act="go"]').onclick = () => { closeLayer(); o.onConfirm(); };
  l.querySelector('[data-act="go"]').focus();
}

/* ---------- routing ---------- */
const routes = {
  "": screenCover, "/": screenCover,
  "/today": screenToday, "/roles": screenRoles, "/role": screenPipeline,
  "/candidate": screenCandidate, "/scorecard": screenScorecard, "/schedule": screenSchedule,
  "/feedback": screenFeedback, "/offers": screenOffers, "/talent": screenTalent,
  "/outreach": screenOutreach, "/rules": screenRules, "/reports": screenReports,
  "/broken": screenError
};
const NAVITEMS = [
  {h:"/today", t:"Today"}, {h:"/roles", t:"Roles"}, {h:"/talent", t:"Talent pool"},
  {h:"/outreach", t:"Outreach"}, {h:"/rules", t:"Automation rules"}, {h:"/reports", t:"Reports"}
];

function parse(){
  const raw = location.hash.replace(/^#/, "");
  const parts = raw.split("/").filter(Boolean);
  return {base:"/" + (parts[0] || ""), arg:parts[1] || null, raw:raw};
}
function render(){
  const r = parse();
  const fn = routes[r.base] || screenNotFound;
  if(fn === screenCover){
    document.getElementById("root").innerHTML = '<div class="boot">' + screenCover() + "</div>";
    window.scrollTo(0,0); wire(); return;
  }
  if(!state.booted){ bootThenRender(); return; }
  const head = {"/today":"Today", "/roles":"Roles", "/talent":"Talent pool", "/outreach":"Outreach",
    "/rules":"Automation rules", "/reports":"Reports", "/offers":"Offers", "/schedule":"Interview scheduling",
    "/scorecard":"Screening scorecard", "/feedback":"Panel feedback", "/broken":"Interview scheduling",
    "/candidate":"Candidate"}[r.base] || (r.base === "/role" && role(r.arg) ? role(r.arg).title : "Shortlist");
  const nav = NAVITEMS.map(n => '<a class="item" href="#' + n.h + '"' + (n.h === r.base ? ' aria-current="page"' : "") +
      ">" + esc(n.t) + (n.h === "/today" ? '<span class="sec num">' + todayQueue().length + "</span>" : "") + "</a>").join("");
  const roleNav = ROLES.map(x => '<a class="item" href="#/role/' + x.id + '"' +
      (r.base === "/role" && r.arg === x.id ? ' aria-current="page"' : "") + '><span class="trunc">' + esc(x.title) +
      '</span><span class="sec num">' + activeCount(x.id) + "</span></a>").join("");
  document.getElementById("root").innerHTML =
    '<div class="app"><nav class="nav" aria-label="Main">' +
      '<div class="brand">Shortlist</div>' + nav +
      '<div class="grp">Open roles</div>' + roleNav +
      '<div class="who">Payal Deshmukh<br>Recruiter, engineering</div>' +
    "</nav><div class=\"main\">" +
      '<header class="top"><span class="crumb">' + esc(head || " ") + '</span>' +
      '<span class="sec">' + TODAY + '</span>' +
      '<button class="btn ghost sm" style="margin-left:auto" data-open-palette>Search candidates, roles, actions <span class="kbd">Cmd K</span></button>' +
      "</header><div class=\"wrap\" id=\"view\">" + fn(r.arg) + "</div></div></div>";
  window.scrollTo(0,0);
  wire();
}
function bootThenRender(){
  document.getElementById("root").innerHTML =
    '<div class="app"><nav class="nav"><div class="brand">Shortlist</div></nav><div class="main">' +
    '<header class="top"><span class="crumb">Loading your day</span></header><div class="wrap">' +
    '<div class="panel"><div class="ph"><h2>Today</h2><span class="count">Pulling interviews, scorecards and offers</span></div>' +
    Array.from({length:5}, (_, i) => '<div class="row"><div class="grow"><div class="skel" style="width:' +
      (58 - i*6) + '%"></div></div><div class="skel" style="width:64px"></div></div>').join("") +
    "</div></div></div></div>";
  setTimeout(() => { state.booted = true; render(); }, 620);
}

/* ---------- cover ---------- */
function screenCover(){
  return '<div class="cover">' +
   "<h1>Shortlist</h1>" +
   '<p class="lede">A hiring console for a six person recruiting team running twelve open roles, sourcing through joining date.</p>' +
   "<section><h3>The problem</h3><p class=\"prose\">Payal has 40 candidates in play across seven roles. Her morning is not a browsing session, it is a queue: whose feedback is late, which interview is at 10:30, which offer has gone quiet. Every tool she has shows her a pipeline. None of them tell her what she has to clear before lunch.</p></section>" +
   "<section><h3>The constraint</h3><p class=\"prose\">One person, one week, fourteen screens that had to be clickable rather than described. The data had to survive being read by a recruiter, so notice periods, compensation and sources are the kind that show up in a real pipeline, not the kind that fill a mockup.</p></section>" +
   "<section><h3>Three decisions</h3>" +
   '<div class="dec"><p class="q">Colour only carries status.</p><p class="prose">Five status colours, five meanings, used nowhere else. A screen with nothing wrong on it is grey and green. When Payal sees amber she is looking at something waiting on her, not at decoration.</p></div>' +
   '<div class="dec"><p class="q">Today is a queue, not a dashboard.</p><p class="prose">The first version opened with four stat cards. They looked like a product and told her nothing she could act on, so they are gone. Every row on Today has something she can do to it right now.</p></div>' +
   '<div class="dec"><p class="q">One state, so counts never disagree.</p><p class="prose">Dragging a card on the pipeline board changes the stage count on the role list, the sidebar and Today in the same frame. Two numbers that disagree is how a prototype tells you it is a prototype.</p></div>' +
   "</section>" +
   '<p style="margin-top:30px"><a class="btn" href="#/today" style="display:inline-block">Open the console</a></p>' +
   "<footer>Scoped, designed and built by one person. Sample data throughout, no real candidates.</footer></div>";
}
function screenNotFound(){
  return '<div class="panel"><div class="ph"><h2>That screen does not exist</h2></div>' +
    '<div class="mb" style="padding:16px"><p class="prose">The address bar has ' + esc(parse().raw) +
    ' in it, and nothing in Shortlist answers to that. Go back to Today and pick up the queue.</p>' +
    '<a class="btn" href="#/today">Go to Today</a></div></div>';
}

/* ---------- today ---------- */
function todayQueue(){
  return state.cands.filter(c => c.waiting && c.stage !== "dropped" && c.stage !== "joined");
}
function screenToday(){
  const today = INTERVIEWS.filter(i => i.state === "today");
  const other = INTERVIEWS.filter(i => i.state !== "today");
  const queue = todayQueue();
  const pending = OFFERS.filter(o => o.status !== "Accepted, joined");
  const behind = ROLES.filter(r => r.id === "r7" || r.id === "r2");

  const ivRows = today.map(i => {
    const c = byId(i.cand);
    return '<div class="row"><span class="num sec" style="width:44px">' + i.when + "</span>" +
      '<div class="grow"><div class="t">' + candLink(c) + '</div><div class="s">' + esc(i.kind) + ", " +
      esc(role(i.role).title) + ", " + esc(i.panel.join(" and ")) + "</div></div>" +
      st("sched","Scheduled") + '<a class="btn ghost sm" href="#/candidate/' + c.id + '">Open profile</a></div>';
  }).join("") || '<div class="empty">No interviews today. Book one from a candidate profile.</div>';

  const qRows = queue.map(c => {
    const s = statusOf(c);
    return '<div class="row"><div class="grow bar b-' + s.cls + '"><div class="t">' + candLink(c) +
      ' <span class="sec">' + esc(role(c.role).title) + '</span></div><div class="s">' + esc(c.waiting) + "</div></div>" +
      todayAction(c) + "</div>";
  }).join("");

  const oRows = pending.map(o => {
    const c = byId(o.cand);
    const wait = o.status === "Waiting on approval";
    return '<div class="row"><div class="grow bar b-wait"><div class="t">' + candLink(c) + "</div>" +
      '<div class="s">' + esc(role(o.role).title) + ", " + lpa(o.fixed) + " fixed, " + esc(o.status.toLowerCase()) + "</div></div>" +
      '<a class="btn ghost sm" href="#/offers">' + (wait ? "Chase approval" : "Open offer") + "</a></div>";
  }).join("");

  const bRows = behind.map(r => {
    const c = inRole(r.id);
    return '<div class="row"><div class="grow bar b-stale"><div class="t">' + link("/role/" + r.id, r.title) + "</div>" +
      '<div class="s">' + r.open + " days open, target was " + esc(r.target) + ", " + c.filter(x => x.stage === "offer").length +
      " at offer and " + c.filter(x => x.stage === "interview").length + " in interview</div></div>" +
      '<a class="btn ghost sm" href="#/role/' + r.id + '">Open pipeline</a></div>';
  }).join("");

  return '<div class="stack">' +
    '<div class="panel"><div class="ph"><h2>Interviews today</h2><span class="count num">' + today.length +
      '</span><div class="right"><a class="link" href="#/schedule">Book an interview</a></div></div>' + ivRows +
      other.map(i => {
        const c = byId(i.cand);
        return '<div class="row"><span class="sec" style="width:96px">' + esc(i.day) + " " + i.when + "</span>" +
          '<div class="grow s">' + esc(i.state === "done" ? "Held, " : "Booked, ") + esc(c.name) + ", " + esc(role(i.role).title) + "</div>" +
          (i.state === "done" ? '<a class="link" href="#/feedback/' + c.id + '">Read feedback</a>' : "") + "</div>";
      }).join("") + "</div>" +
    '<div class="cols2">' +
      '<div class="panel"><div class="ph"><h2>Waiting on you</h2><span class="count num">' + queue.length + "</span></div>" + qRows + "</div>" +
      '<div class="stack">' +
        '<div class="panel"><div class="ph"><h2>Offers pending</h2><span class="count num">' + pending.length + "</span></div>" + oRows + "</div>" +
        '<div class="panel"><div class="ph"><h2>Roles behind target</h2><span class="count num">' + behind.length + "</span></div>" + bRows + "</div>" +
      "</div>" +
    "</div></div>";
}
function todayAction(c){
  if(/scorecard/i.test(c.waiting)) return '<a class="btn ghost sm" href="#/scorecard/' + c.id + '">Write scorecard</a>';
  if(/split/i.test(c.waiting))     return '<a class="btn ghost sm" href="#/feedback/' + c.id + '">Compare feedback</a>';
  if(/feedback/i.test(c.waiting))  return '<a class="btn ghost sm" href="#/feedback/' + c.id + '">Chase feedback</a>';
  if(/not booked/i.test(c.waiting)) return '<a class="btn ghost sm" href="#/schedule/' + c.id + '">Book a call</a>';
  if(/Offer/i.test(c.waiting))     return '<a class="btn ghost sm" href="#/offers">Open offer</a>';
  if(/No reply/i.test(c.waiting))  return '<a class="btn ghost sm" href="#/outreach">Open sequence</a>';
  return '<a class="btn ghost sm" href="#/candidate/' + c.id + '">Open profile</a>';
}

/* ---------- roles ---------- */
function screenRoles(){
  const cols = [{k:"title",t:"Role"},{k:"hm",t:"Hiring manager"},{k:"open",t:"Days open",r:true},
    {k:"active",t:"In play",r:true},{k:"screening",t:"Screening",r:true},{k:"interview",t:"Interview",r:true},
    {k:"offer",t:"Offer",r:true},{k:"target",t:"Target close"}];
  const rows = ROLES.map(r => ({
    r:r, active:activeCount(r.id), screening:stageCount(r.id,"screening"),
    interview:stageCount(r.id,"interview") + stageCount(r.id,"feedback"), offer:stageCount(r.id,"offer")
  }));
  const s = state.rolesSort;
  rows.sort((a,b) => {
    const va = s.key in a ? a[s.key] : a.r[s.key], vb = s.key in b ? b[s.key] : b.r[s.key];
    const c = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
    return s.dir === "asc" ? c : -c;
  });
  const head = cols.map(c => '<th class="sortable' + (c.r ? " r" : "") + '" data-sort="' + c.k + '">' + c.t +
    (s.key === c.k ? ' <span class="sec">' + (s.dir === "asc" ? "\u2191" : "\u2193") + "</span>" : "") + "</th>").join("");
  const body = rows.map(x => {
    const late = x.r.open > 55;
    return "<tr><td>" + link("/role/" + x.r.id, x.r.title) + '<div class="s sec">' + esc(x.r.loc) + ", " + esc(x.r.band) + "</div></td>" +
      "<td>" + esc(x.r.hm) + '<div class="s sec">' + esc(x.r.rec) + "</div></td>" +
      '<td class="r num">' + x.r.open + "</td>" +
      '<td class="r num">' + x.active + "</td><td class=\"r num\">" + x.screening + '</td><td class="r num">' + x.interview +
      '</td><td class="r num">' + x.offer + "</td>" +
      "<td>" + st(late ? "stale" : "fwd", x.r.target + (late ? ", missed" : "")) + "</td></tr>";
  }).join("");
  return '<div class="panel"><div class="ph"><h2>Open roles</h2><span class="count num">' + ROLES.length +
    ' roles, ' + state.cands.filter(c => c.stage !== "joined" && c.stage !== "dropped").length +
    ' candidates in play</span></div><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>";
}

/* ---------- role pipeline board ---------- */
function screenPipeline(rid){
  const r = role(rid) || ROLES[0];
  const cols = STAGES.map(s => {
    const list = inRole(r.id).filter(c => c.stage === s.id);
    const cards = list.map(c => {
      const stat = statusOf(c);
      return '<article class="card" draggable="true" data-card="' + c.id + '" tabindex="0" aria-label="' +
        esc(c.name + ", " + stageLabel(c.stage)) + '">' +
        '<div class="nm">' + esc(c.name) + "</div>" +
        '<div class="mt">' + esc(c.co) + ", " + c.exp + " yrs</div>" +
        '<div class="mt">' + esc(noticeText(c)) + ", " + lpa(c.exp_ctc) + "</div>" +
        '<div class="mt" style="margin-top:6px">' + st(stat.cls, stat.label) + "</div>" +
        '<div class="mv"><select data-move="' + c.id + '" aria-label="Move ' + esc(c.name) + ' to another stage">' +
          STAGES.map(x => '<option value="' + x.id + '"' + (x.id === c.stage ? " selected" : "") + ">" + x.label + "</option>").join("") +
        "</select></div></article>";
    }).join("") || '<div class="empty">' + (s.id === "sourced" ? "Nothing sourced yet. Add names from the talent pool." : "Nothing here. Drag a card across when it moves.") + "</div>";
    return '<section class="col' + (s.term ? " term" : "") + '" data-col="' + s.id + '">' +
      '<div class="colh"><span class="dot d-' + colDot(s.id) + '"></span><strong>' + s.label +
      '</strong><span class="n num" data-n="' + s.id + '">' + list.length + "</span></div>" +
      '<div class="cards">' + cards + "</div></section>";
  }).join("");
  return '<div class="panel" style="margin-bottom:16px"><div class="ph"><h2>' + esc(r.title) + "</h2>" +
    '<span class="count">' + esc(r.hm) + ", " + r.open + " days open, target " + esc(r.target) + ", " + esc(r.band) + "</span>" +
    '<div class="right"><a class="btn ghost sm" href="#/schedule">Book an interview</a></div></div></div>' +
    '<p class="sec" style="margin-bottom:10px">Drag a card to another column to move the candidate. On a narrow screen, use the stage list on the card.</p>' +
    '<div class="board" id="board">' + cols + "</div>";
}
function colDot(id){
  return ({sourced:"stale", applied:"stale", screening:"wait", interview:"sched",
    feedback:"wait", offer:"fwd", joined:"fwd", dropped:"drop"})[id];
}
function moveCandidate(id, stage){
  const c = byId(id);
  if(!c || c.stage === stage) return;
  const from = stageLabel(c.stage);
  c.stage = stage;
  if(stage === "offer" || stage === "joined" || stage === "dropped") c.waiting = "";
  c.last = TODAY.replace("Thu ", "");
  c.tl = (c.tl || []).concat([{on:"10 Sep", text:"Moved from " + from + " to " + stageLabel(stage) + " by Payal Deshmukh"}]);
  render();
  toast("Moved to " + stageLabel(stage).toLowerCase());
}

  const notes = (state.forms["note_" + c.id] ? [{by:"Payal Deshmukh", on:"10 Sep", text:state.forms["note_" + c.id]}] : [])
    .concat(c.notes).map(n => '<div class="note"><div class="meta">' + esc(n.by) + ", " + esc(n.on) + "</div>" + esc(n.text) + "</div>").join("");

   '<div class="cols3"><div class="stack">' +
     '<div class="panel"><div class="ph"><h2>Details</h2><span class="count">' + esc(r.title) + ", " + stageLabel(c.stage) + "</span></div>" +
     '<dl class="kv">' +

/* ---------- screening scorecard ---------- */
const SC_DIMS = ["Communication","Relevant experience","Salary fit","Notice period","Interest level"];
function screenScorecard(id){
  const c = byId(id) || state.cands.find(x => x.waiting && /scorecard/i.test(x.waiting)) || state.cands[0];
  const f = state.forms["sc_" + c.id] || {};
  const saved = state.forms["sc_done_" + c.id];
  const scale = (dim) => '<div class="field"><label class="f">' + dim + "</label>" +
    '<div class="scale">' + [1,2,3,4,5].map(n => '<label><input type="radio" name="' + dim + '" value="' + n + '"' +
      (String(f[dim]) === String(n) ? " checked" : "") + '><span>' + n + "</span></label>").join("") + "</div></div>";
  return '<div class="panel" style="margin-bottom:16px"><div class="ph"><h2>Screening scorecard</h2>' +
    '<span class="count">' + esc(c.name) + ", " + esc(role(c.role).title) + ", call held " + esc(c.last) + "</span>" +
    '<div class="right"><a class="link" href="#/candidate/' + c.id + '">Open profile</a></div></div>' +
    '<div class="row"><div class="grow s">' + esc(c.title) + ", " + esc(c.co) + ", " + esc(noticeText(c)) + ", " +
      lpa(c.cur) + " now, " + lpa(c.exp_ctc) + " expected</div></div></div>" +
    (saved ? '<div class="panel" style="margin-bottom:16px"><div class="row bar b-fwd"><div class="grow"><div class="t">Scorecard saved</div>' +
      '<div class="s">' + esc(saved) + "</div></div></div></div>" : "") +
    '<form class="panel" data-form="scorecard" data-id="' + c.id + '">' +
    '<div class="ph"><h2>Rate the call, 1 is poor and 5 is strong</h2></div>' +
    '<div style="padding:14px">' + SC_DIMS.map(scale).join("") +
    '<div class="field"><label class="f" for="rec">Recommendation</label><select id="rec" name="rec">' +
      ["Advance to panel interview","Hold for another role","Do not advance"].map(o =>
        '<option' + (f.rec === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select></div>" +
    '<div class="field"><label class="f" for="cm">Why, in your words</label>' +
      '<textarea id="cm" name="comment" aria-describedby="cmh">' + esc(f.comment || "") + "</textarea>" +

/* ---------- talent pool ---------- */
function matches(c){
  const f = state.filters, q = f.q.trim().toLowerCase();
  if(q && !(c.name + " " + c.title + " " + c.co + " " + c.skills.join(" ") + " " + c.id).toLowerCase().includes(q)) return false;
  if(f.notice){
    const n = typeof c.notice === "number" ? c.notice : (/Immediate|Serving/.test(c.notice) ? 0 : 999);
    if(n > +f.notice) return false;
  }
  if(f.loc && c.loc !== f.loc) return false;
  if(f.src && !c.src.startsWith(f.src)) return false;
  if(f.maxExp && (c.exp_ctc == null || c.exp_ctc > +f.maxExp)) return false;
  return true;
}

  const f = state.filters;

  ROLES.forEach(r => { if(!s || r.title.toLowerCase().includes(s) || r.hm.toLowerCase().includes(s))
    out.push({t:r.title, s:r.hm + ", " + activeCount(r.id) + " in play", h:"#/role/" + r.id, k:"Role"}); });
  state.cands.forEach(c => { if(!s || (c.name + " " + c.co + " " + c.id + " " + c.skills.join(" ")).toLowerCase().includes(s))
    out.push({t:c.name, s:c.title + ", " + c.co + ", " + stageLabel(c.stage), h:"#/candidate/" + c.id, k:"Candidate"}); });
  return out.slice(0, 40);
}
function openPalette(){
  const l = document.getElementById("layer");
  l.innerHTML = '<div class="scrim"><div class="modal pal" role="dialog" aria-modal="true" aria-label="Search">' +
    '<input id="palq" type="text" placeholder="Search candidates, roles and actions" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pallist">' +
    '<ul id="pallist" role="listbox"></ul></div></div>';
  const inp = l.querySelector("#palq"), list = l.querySelector("#pallist");
  let idx = 0, items = [];
  function draw(){
    items = paletteItems(inp.value);
    list.innerHTML = items.length ? items.map((it, i) => '<li role="option" aria-selected="' + (i === idx) + '">' +
      '<button data-go="' + it.h + '"><span>' + esc(it.t) + (it.s ? ' <span class="sec">' + esc(it.s) + "</span>" : "") +
      '</span><span class="kind">' + it.k + "</span></button></li>").join("") :
      '<li><div class="empty">Nothing matches that. Try a company name, a skill or a candidate ID.</div></li>';
  }
  draw();
  inp.addEventListener("input", () => { idx = 0; draw(); });
  inp.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); draw(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); idx = Math.max(idx - 1, 0); draw(); }
    else if(e.key === "Enter" && items[idx]){ e.preventDefault(); location.hash = items[idx].h; closeLayer(); }
    else if(e.key === "Escape"){ closeLayer(); }
  });
  list.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if(b){ location.hash = b.getAttribute("data-go"); closeLayer(); }
  });
  l.querySelector(".scrim").addEventListener("mousedown", e => { if(e.target.classList.contains("scrim")) closeLayer(); });
  inp.focus();
}

/* ---------- wiring ---------- */
function wire(){
  const v = document.getElementById("root");

  v.querySelectorAll("[data-open-palette]").forEach(b => b.onclick = openPalette);

  /* roles sorting */
  v.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const k = th.getAttribute("data-sort");
    state.rolesSort = {key:k, dir: state.rolesSort.key === k && state.rolesSort.dir === "desc" ? "asc" : "desc"};
    render();
  });

  /* board drag and drop */
  const board = document.getElementById("board");
  if(board){
    board.querySelectorAll(".card").forEach(card => {
      card.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", card.getAttribute("data-card"));
        e.dataTransfer.effectAllowed = "move";
        card.classList.add("drag");
      });
      card.addEventListener("dragend", () => card.classList.remove("drag"));
    });
    board.querySelectorAll(".col").forEach(col => {
      col.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over"); });
      col.addEventListener("dragleave", () => col.classList.remove("over"));
      col.addEventListener("drop", e => {
        e.preventDefault(); col.classList.remove("over");
        moveCandidate(e.dataTransfer.getData("text/plain"), col.getAttribute("data-col"));
      });
    });
    board.querySelectorAll("[data-move]").forEach(sel => sel.onchange = () => moveCandidate(sel.getAttribute("data-move"), sel.value));
  }

  /* profile actions */
  v.querySelectorAll("[data-move-to]").forEach(b => b.onclick = () => moveCandidate(b.getAttribute("data-id"), b.getAttribute("data-move-to")));
  v.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
    const c = byId(b.getAttribute("data-drop"));
    confirmDialog({
      title:"Move " + c.name + " to dropped?",
      body:"<p class=\"prose\">She stays in the talent pool and keeps her history, and " + esc(role(c.role).title) +
        " loses a candidate at " + stageLabel(c.stage).toLowerCase() + ". Anyone on the team can re-open her against another role later.</p>",
      confirm:"Move to dropped",
      onConfirm:() => moveCandidate(c.id, "dropped")
    });
  });

  /* rules */
  v.querySelectorAll("[data-rule]").forEach(b => b.onclick = () => {
    const r = state.rules.find(x => x.id === b.getAttribute("data-rule"));
    r.on = !r.on; render(); toast(r.on ? "Rule turned on" : "Rule turned off");
  });

  /* talent pool */
  v.querySelectorAll("[data-clear-filters]").forEach(b => b.onclick = () => {
    state.filters = {q:"",notice:"",loc:"",src:"",maxExp:""}; state.activeSaved = null; render(); toast("Filters cleared");
  });
  v.querySelectorAll("[data-saved]").forEach(b => b.onclick = () => {
    const s = SAVED.find(x => x.id === b.getAttribute("data-saved"));
    state.filters = Object.assign({}, s.f); state.activeSaved = s.id; render(); toast("Saved search applied, " + s.name.toLowerCase());
  });
  v.querySelectorAll("[data-save-current]").forEach(b => b.onclick = () => {
    const f = state.filters;
    const name = [f.q, f.loc, f.src, f.notice ? "under " + f.notice + " days" : "", f.maxExp ? "under " + f.maxExp + ".0 LPA" : ""]
      .filter(Boolean).join(", ") || "Everyone";
    if(!SAVED.some(s => s.name === name)){ SAVED.push({id:"s" + (SAVED.length + 1), name:name, f:Object.assign({}, f)}); }
    render(); toast("Search saved as " + name.toLowerCase());
  });

  /* outreach template picker */
  v.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { state.forms.tpl = b.getAttribute("data-tpl"); render(); });
  v.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => toast(b.textContent.trim() + " noted for " + b.getAttribute("data-nudge")));

  /* scheduling slots */
  v.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => {
    const form = b.closest("form"), id = form.getAttribute("data-id");
    const f = state.forms["sched_" + id] || {slot:null, who:["Karan Belliappa","Ismail Sait"]};
    f.slot = +b.getAttribute("data-slot");
    f.who = Array.from(form.querySelectorAll('input[name="who"]:checked')).map(x => x.value);
    f.kind = form.querySelector("#kind").value;
    state.forms["sched_" + id] = f; render();
  });

  /* notes draft kept for the session */
  const nt = v.querySelector('form[data-form="note"] textarea');
  if(nt) nt.addEventListener("input", () => { state.forms["note_draft_" + nt.closest("form").getAttribute("data-id")] = nt.value; });

  /* forms */
  v.querySelectorAll("form[data-form]").forEach(form => form.addEventListener("submit", e => {
    e.preventDefault();
    const kind = form.getAttribute("data-form"), id = form.getAttribute("data-id");
    const fd = new FormData(form);
    if(kind === "filters"){
      state.filters = {q:fd.get("q") || "", notice:fd.get("notice") || "", loc:fd.get("loc") || "",
        src:fd.get("src") || "", maxExp:fd.get("maxExp") || ""};
      state.activeSaved = null; render(); toast("Filters applied"); return;
    }
    if(kind === "note"){
      const text = (fd.get("text") || "").toString().trim();
      if(!text){ toast("Write something before adding the note"); return; }
      const c = byId(id);
      c.notes = [{by:"Payal Deshmukh", on:"10 Sep", text:text}].concat(c.notes);
      state.forms["note_draft_" + id] = ""; render(); toast("Note added"); return;
    }
    if(kind === "scorecard"){
      const comment = (fd.get("comment") || "").toString().trim();
      const f = {rec:fd.get("rec"), comment:comment};
      SC_DIMS.forEach(d => f[d] = fd.get(d));
      state.forms["sc_" + id] = f;
      const err = form.querySelector("#cmerr");
      if(!comment){ err.hidden = false; form.querySelector("#cm").focus(); return; }
      err.hidden = true;
      const c = byId(id);
      c.waiting = "";
      c.tl = (c.tl || []).concat([{on:"10 Sep", text:"Screening scorecard saved by Payal Deshmukh, " + f.rec.toLowerCase()}]);
      state.forms["sc_done_" + id] = f.rec + ", saved 10 Sep by Payal Deshmukh";
      if(f.rec === "Advance to panel interview" && c.stage === "screening") c.stage = "interview";
      render(); toast("Scorecard saved"); return;
    }
    if(kind === "schedule"){
      const f = state.forms["sched_" + id] || {slot:null, who:[]};
      f.who = fd.getAll("who"); f.kind = fd.get("kind");
      state.forms["sched_" + id] = f;
      const err = form.querySelector("#sloterr");
      if(f.slot == null){ err.hidden = false; return; }
      err.hidden = true;
      const s = SLOT_GRID[f.slot];
      if(s.clash && f.who.indexOf("Ismail Sait") > -1){ location.hash = "#/broken"; return; }
      const c = byId(id);
      c.waiting = "";
      c.tl = (c.tl || []).concat([{on:"10 Sep", text:f.kind + " booked for " + s.day + " " + s.time + " with " + f.who.join(" and ")}]);
      state.forms["sched_done_" + id] = "Invite sent for " + s.day + " " + s.time + " to " + f.who.join(" and ") + ".";
      render(); toast("Interview invite sent"); return;
    }
    if(kind === "rule"){
      const name = (fd.get("name") || "").toString().trim();
      state.forms.rule = {when:fd.get("when"), days:fd.get("days"), then:fd.get("then"), name:name};
      const err = form.querySelector("#rerr");
      if(!name){ err.hidden = false; form.querySelector("#rn").focus(); return; }
      err.hidden = true;
      state.rules.push({id:"ru" + (state.rules.length + 1), on:true, name:name,
        when:fd.get("when") + " for " + fd.get("days"), then:fd.get("then"), fired:0, last:"Not fired yet"});
      state.forms.rule = {}; render(); toast("Rule added");
      return;
    }
  }));
}

/* ---------- boot ---------- */
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    if(parse().base === "/" || parse().base === "") location.hash = "#/today";
    openPalette();
  }
  if(e.key === "Escape") closeLayer();
});
window.addEventListener("hashchange", render);
render();
</script>
