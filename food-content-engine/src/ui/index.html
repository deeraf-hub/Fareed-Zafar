<style>
:root{

  --text:#EDEDF0; --muted:#A3A3AB; --faint:#6C6C76; --accent:#FF6B35; --accent-ink:#151515; --accent-soft:rgba(255,107,53,.16);
  --gold:#FFD23F; --pass:#3DBE7A; --warn:#E0A526; --fail:#E5484D; --info:#6AA0F0; --pass-soft:rgba(61,190,122,.16); --warn-soft:rgba(224,165,38,.18); --fail-soft:rgba(229,72,77,.16); --shadow:0 12px 40px rgba(0,0,0,.5);

  --text:#EDEDF0; --muted:#A3A3AB; --faint:#6C6C76; --accent:#FF6B35; --accent-ink:#151515; --accent-soft:rgba(255,107,53,.16);

*{box-sizing:border-box} [hidden]{display:none!important} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);padding:14px 12px;gap:6px}
.side .proj{padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side .proj b{display:block;font-size:15px} .side .proj small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px;word-break:break-all;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}

.nav a:hover{background:var(--card-2);color:var(--text)} .nav a.is-active{background:var(--accent-soft);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}

.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none} .pill.ok i{background:var(--pass)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--fail)}
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snapbanner{background:var(--warn-soft);color:var(--text);border-bottom:1px solid var(--line);padding:8px 24px;font-size:13px}
#view{padding:20px 24px 40px;max-width:1400px;width:100%;outline:none}
h2{font-size:18px;font-weight:600;margin:0 0 12px;text-wrap:balance} h3{font-size:14px;font-weight:600;margin:0 0 8px} .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono);font-size:12px} .num{font-variant-numeric:tabular-nums} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row.between{justify-content:space-between} .stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px} .grid>*{min-width:0} .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))} .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))} .grid.side-8-4{grid-template-columns:minmax(0,5fr) minmax(300px,2fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.flush{padding:0;overflow:hidden} .card>h3{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-decoration:none;display:block}
.tile b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1} .tile span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px;font-weight:600} .tile small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;font-weight:500;font-size:13px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--card-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--card-2)} .btn.sm{padding:4px 9px;font-size:12px} .btn.danger{color:var(--fail)} .btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line-strong);background:var(--card);cursor:default;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent)} .chip button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);line-height:1} .chip[role=button],.chip.click{cursor:pointer}
.chip.stage{border-color:transparent;background:color-mix(in srgb,var(--stage) 22%,var(--card));color:var(--text)} .chip.stage::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--stage)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.badge.pass{background:var(--pass-soft);color:var(--pass)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.fail{background:var(--fail-soft);color:var(--fail)} .badge.neutral{background:var(--card-2);color:var(--muted)} .badge.gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)} .badge.ai{background:color-mix(in srgb,#8b7cf6 22%,transparent);color:#8b7cf6}
.table-wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle} tr:last-child td{border-bottom:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tbody tr:hover td{background:color-mix(in srgb,var(--card-2) 60%,transparent)} tr.click{cursor:pointer}
.thumb{width:72px;aspect-ratio:4/3;border-radius:6px;background:#0a0a0a;object-fit:cover;flex:none} .ph{display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:#fff;text-align:center;padding:4px;background:color-mix(in srgb,var(--stage,#555) 55%,#0a0a0a)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px}
.shot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.shot .pic{position:relative;aspect-ratio:4/3;background:#0a0a0a} .shot .pic img{width:100%;height:100%;object-fit:cover} .shot .pic .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font:500 11px/1 var(--mono);padding:3px 5px;border-radius:4px}
.shot .pic .rank{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font:600 11px/1 var(--mono);padding:3px 6px;border-radius:4px}
.shot .pic .dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px} .shot .pic .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)} .shot .pic .dots i.on{background:#fff}
.shot.dead .pic{filter:grayscale(1) brightness(.6)} .shot.dead .pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.12) 10px 12px)}
.shot .meta{padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0} .shot .meta .t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .shot .meta .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .flags{display:flex;gap:4px;flex-wrap:wrap} .shot.selected{outline:2px solid var(--accent);outline-offset:-2px}
.q{display:inline-flex;gap:2px} .q i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)} .q i.on{background:var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .filters select{width:auto;max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0} .field label{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=search],select,textarea{padding:7px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);min-width:0;width:100%}
textarea{resize:vertical;min-height:64px} input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card)}
.searchbar{display:flex;gap:8px;align-items:center} .searchbar input{height:44px;font-size:15px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)} .empty strong{color:var(--text);display:block;margin-bottom:6px} .empty.error{border-color:var(--fail);color:var(--text)}
.skeleton{background:linear-gradient(90deg,var(--card-2),var(--card),var(--card-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:8px;min-height:80px} @keyframes sk{to{background-position:-200% 0}}
.meter{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;position:relative} .meter b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px} .meter.short b{background:var(--warn)}
.cov{display:inline-flex;gap:4px} .cov i{width:9px;height:9px;border-radius:50%;background:var(--stage,var(--pass));display:inline-block} .cov i.no{background:transparent;border:1.5px solid var(--fail)}
.timeline{display:flex;height:56px;gap:2px;border-radius:8px;overflow:hidden;background:var(--card-2)} .timeline .seg{position:relative;min-width:3px;background-size:cover;background-position:center;border-top:3px solid var(--slot,var(--muted));cursor:pointer} .timeline .seg.gap{background:repeating-linear-gradient(135deg,var(--fail-soft) 0 8px,transparent 8px 12px);border-top-color:var(--fail)} .timeline .seg:hover{filter:brightness(1.15)} .timeline .seg span{position:absolute;left:4px;bottom:3px;font:500 10px/1 var(--mono);color:#fff;text-shadow:0 1px 2px #000}
.ruler{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--faint);margin-top:4px}
.preview{position:relative;background:#0a0a0a;border-radius:var(--radius);overflow:hidden;aspect-ratio:9/16;max-width:100%;margin:0 auto} .preview video,.preview img{width:100%;height:100%;object-fit:contain;display:block} .preview .zone{position:absolute;left:0;right:0;background:rgba(255,80,80,.22);pointer-events:none;border:1px dashed rgba(255,120,120,.7)} .preview .zone.l,.preview .zone.r{top:0;bottom:0;left:auto;right:auto}
.preview .zone small{position:absolute;left:6px;top:4px;font:10px var(--mono);color:#fff}
.qc-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)} .qc-row:last-child{border-bottom:0} .qc-row .badge{margin-top:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px} .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-word}
.cap-edit{width:100%;min-width:180px} .counter{font-size:11px;color:var(--muted);font-family:var(--mono)} .counter.over{color:var(--warn)}

.jobbtn{position:relative} .jobbtn .n{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;border-radius:999px;padding:1px 6px}
.copyblock{position:relative;background:var(--card-2);border-radius:8px;padding:10px 12px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word} .copyblock .btn{position:absolute;right:6px;top:6px}

.bar-list{display:flex;flex-direction:column;gap:6px} .bar-list div{display:grid;grid-template-columns:130px 1fr 32px;gap:8px;align-items:center;font-size:12px} .bar-list b{height:8px;border-radius:4px;background:var(--accent);display:block;opacity:.85}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px} .tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px} .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.stars{display:inline-flex;gap:2px} .stars button{border:0;background:none;padding:0;cursor:pointer;font-size:15px;color:var(--line-strong);line-height:1} .stars button.on{color:var(--gold)}
.frames3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px} .frames3 img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#0a0a0a}
.canvas-wrap{display:flex;justify-content:center} canvas{max-width:100%;border-radius:10px;background:#0a0a0a}

.tabbar{display:none} #lib-grid .btn{white-space:normal;text-align:left}

    <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v14"/></svg>Library</a>
    <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
    <a href="#/plans" data-nav="plans"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 20V9"/></svg>Plans</a>

</div>
<script>
// ---------- data layer: live API or embedded snapshot ----------
const SNAP = (() => {
  const el = document.getElementById("fce-snapshot");
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch { return null; }
})();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtS = (n) => (n == null ? "–" : `${Number(n).toFixed(n >= 10 ? 0 : 1)}s`);
const fmtMin = (sec) => { const s = Math.round(sec || 0); return s < 90 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; };
const tc = (sec, fps = 30) => { const f = Math.round(sec * fps); const F = Math.round(fps); const p = (n) => String(n).padStart(2, "0"); return `${p(Math.floor(f / F / 3600))}:${p(Math.floor(f / F / 60) % 60)}:${p(Math.floor(f / F) % 60)}:${p(f % F)}`; };
const label = (t) => String(t ?? "").replace(/_/g, " ");
const title = (t) => label(t).replace(/(^|\s)\S/g, (c) => c.toUpperCase());

const api = {
  async get(path) {
    if (SNAP) return snapGet(path);
    const r = await fetch(path);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    return r.json();
  },
  async send(method, path, body) {
    if (SNAP) throw new Error("This is a shared snapshot. Run `fce ui` locally to use actions.");
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  },
};

// ---------- snapshot search: a port of src/search.js offline parsing + ranking ----------
const TX = SNAP?.taxonomy;
function buildMatcher(table) { const e = []; for (const [tag, phrases] of Object.entries(table)) for (const p of phrases) e.push({ phrase: p.toLowerCase(), tag }); return e.sort((a, b) => b.phrase.length - a.phrase.length); }
const MATCHERS = TX ? {
  shot_type: buildMatcher(TX.SYNONYMS.shot_type), camera_motion: buildMatcher(TX.SYNONYMS.camera_motion), stage: buildMatcher(TX.SYNONYMS.stage), action: buildMatcher(TX.SYNONYMS.action),
  ingredient: buildMatcher({ ...Object.fromEntries(TX.INGREDIENTS.map((i) => [i, [i.replace(/_/g, " ")]])), ...TX.INGREDIENT_SYNONYMS }),
} : null;
const normalize = (t) => String(t ?? "").toLowerCase().replace(/\.[a-z0-9]{2,4}$/i, "").replace(/[_\-./\\]+/g, " ").replace(/[^\p{L}\p{N}\s']/gu, " ").replace(/\s+/g, " ").trim();
function matchAll(m, text) { const found = []; let rem = ` ${text} `; for (const { phrase, tag } of m) { const n = ` ${phrase} `; if (rem.includes(n)) { if (!found.includes(tag)) found.push(tag); rem = rem.split(n).join(" "); } } return found; }
const STOP = new Set("show me all find get give the a an of with for and or in on at to from that this those these shots shot clips clip footage video videos recipe recipes any some every please i want need looking".split(" "));
function parseQueryLocal(q) {
  const t = normalize(q);
  const f = { ingredients: [], actions: [], shot_types: [], stages: [], camera_motion: [], dish: null, hero_only: false, hook_only: false, min_quality: null, has_face: null, terms: [], min_duration: null, max_duration: null };
  if (!MATCHERS) { f.terms = t.split(" ").filter((w) => w.length > 2 && !STOP.has(w)); return f; }
  f.ingredients = matchAll(MATCHERS.ingredient, t); f.actions = matchAll(MATCHERS.action, t); f.shot_types = matchAll(MATCHERS.shot_type, t); f.stages = matchAll(MATCHERS.stage, t); f.camera_motion = matchAll(MATCHERS.camera_motion, t);
  f.hero_only = /\b(hero|beauty|money shot|reveal|final dish)\b/.test(t); f.hook_only = /\b(hook|opener|opening)\b/.test(t);
  if (/\b(face|talking|to camera|reaction)\b/.test(t)) f.has_face = true; if (/\bno (face|people|person)\b|\bhands only\b/.test(t)) f.has_face = false;
  if (/\b(best|top|high quality|quality)\b/.test(t)) f.min_quality = 4;
  const dm = t.match(/\b(under|less than|shorter than|max)\s+(\d+(?:\.\d+)?)\s*s/); if (dm) f.max_duration = Number(dm[2]);
  const dm2 = t.match(/\b(over|longer than|at least|min)\s+(\d+(?:\.\d+)?)\s*s/); if (dm2) f.min_duration = Number(dm2[2]);
  const known = new Set([...f.ingredients, ...f.actions, ...f.shot_types, ...f.stages, ...f.camera_motion].flatMap((x) => x.split("_")));
  f.terms = t.split(" ").filter((w) => w.length > 2 && !STOP.has(w) && !known.has(w) && !/^\d+s?$/.test(w));
  return f;
}
function overlap(list, wanted) { if (!wanted?.length) return null; const have = new Set((list ?? []).map((x) => String(x).toLowerCase())); return wanted.filter((w) => have.has(String(w).toLowerCase())).length; }
function scoreLocal(shot, f, textHit) {
  let facets = 0, matched = 0, score = 0;
  const facet = (hits, w) => { facets++; if (hits) { matched++; score += w * hits; } };
  if (f.ingredients?.length) { const dishHit = f.ingredients.some((i) => (shot.dish ?? shot.clip_recipe ?? "").toLowerCase().includes(String(i).toLowerCase().replace(/_/g, " ")) || (shot.clip_recipe ?? "").includes(String(i).toLowerCase())); facet((overlap(shot.ingredients, f.ingredients) || 0) + (dishHit ? 0.5 : 0), 10); }
  if (f.actions?.length) facet(overlap(shot.actions, f.actions), 10);
  if (f.shot_types?.length) facet(f.shot_types.includes(shot.shot_type) ? 1 : 0, 6);
  if (f.stages?.length) facet(f.stages.includes(shot.stage) ? 1 : 0, 6);
  if (f.camera_motion?.length) facet(f.camera_motion.includes(shot.camera_motion) ? 1 : 0, 4);
  if (f.hero_only) facet(shot.hero_worthy ? 1 : 0, 6);
  if (f.hook_only) facet(shot.hook_worthy ? 1 : 0, 6);
  if (f.terms?.length) facet(textHit ? 1 : 0, 4);
  if (f.has_face === true && !shot.has_face) return null; if (f.has_face === false && shot.has_face) return null;
  if (f.min_quality && (shot.quality ?? 0) < f.min_quality) return null;
  if (f.min_duration && shot.duration < f.min_duration) return null; if (f.max_duration && shot.duration > f.max_duration) return null;
  if (facets > 0 && matched === 0) return null;
  score += (shot.quality ?? 3) * 1.5; if (shot.hero_worthy) score += 1; if (shot.hook_worthy) score += 1; if (!(shot.used > 0)) score += 2; if (textHit) score += 2; if (shot.dead) score -= 8;
  return { score: Math.round(score * 100) / 100, matched, facets };
}
function searchLocal(q, { limit = 60, unused = false, strict = false, recipe, dead = false } = {}) {
  const f = q ? parseQueryLocal(q) : parseQueryLocal("");
  const out = [];
  for (const s of SNAP.shots) {
    if (recipe && s.clip_recipe !== recipe) continue; if (!dead && s.dead) continue; if (unused && s.used > 0) continue;
    const hay = normalize(`${s.description} ${(s.keywords || []).join(" ")} ${(s.ingredients || []).join(" ")} ${(s.actions || []).join(" ")} ${s.clip_filename} ${s.clip_recipe}`);
    const textHit = f.terms?.length ? f.terms.some((t) => hay.includes(t.replace(/(ing|ed|s)$/, ""))) : false;
    const r = scoreLocal(s, f, textHit); if (!r) continue; if (strict && r.matched < r.facets) continue;
    out.push({ ...s, ...r });
  }
  out.sort((a, b) => b.matched - a.matched || b.score - a.score || a.id - b.id);
  return { query: q, filter: f, mode: "snapshot", results: out.slice(0, limit) };
}
function snapGet(path) {
  const u = new URL(path, location.origin); const p = u.pathname; const q = u.searchParams;
  let m;
  if (p === "/api/status") return SNAP.status;
  if (p === "/api/clips") return SNAP.clips.filter((c) => (!q.get("recipe") || c.recipe === q.get("recipe")) && (!q.get("source") || c.source_type === q.get("source")));
  if ((m = p.match(/^\/api\/clips\/(\d+)$/))) { const d = SNAP.clipDetails[m[1]]; if (!d) throw new Error("clip not found"); return d; }
  if (p === "/api/shots") return searchLocal((q.get("q") ?? "").trim(), { limit: Number(q.get("limit") ?? 60), unused: q.get("unused") === "1", strict: q.get("strict") === "1", recipe: q.get("recipe") || undefined, dead: q.get("dead") === "1" });
  if (p === "/api/recipes") return SNAP.status.recipes;
  if (p === "/api/templates") return SNAP.templates;
  if (p === "/api/plans") return SNAP.plans;
  if ((m = p.match(/^\/api\/plans\/(.+)$/))) { const d = SNAP.planDetails[decodeURIComponent(m[1])]; if (!d) throw new Error("plan not found"); return d; }
  if (p === "/api/report") return SNAP.report;
  if (p === "/api/unused") return SNAP.unused;
  if (p === "/api/brand") return SNAP.brand;
  if (p === "/api/broll") return SNAP.broll;
  if (p === "/api/jobs") return [];
  throw new Error(`not in snapshot: ${p}`);
}

// ---------- router ----------
const routes = {};
function route() {
  const hash = location.hash.startsWith("#/") ? location.hash.slice(2) : "";
  const [pathPart, qs = ""] = hash.split("?");
  const parts = pathPart.split("/").filter(Boolean);
  return { screen: parts[0] || "library", parts, params: new URLSearchParams(qs) };
}
function go(hash) { location.hash = hash; }
async function render() {
  const r = route();
  const fn = routes[r.screen] || routes.library;
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("is-active", a.dataset.nav === r.screen));
  const view = document.getElementById("view");
  view.setAttribute("aria-busy", "true");
  try { await fn(view, r); } catch (err) { view.innerHTML = `<div class="empty error"><strong>Could not load this screen.</strong><p>${esc(err.message)}</p></div>`; }
  view.removeAttribute("aria-busy");
  view.focus({ preventScroll: true });
}
window.addEventListener("hashchange", render);

// ---------- toast + jobs ----------
function toast(msg, kind = "info") {
  const el = document.getElementById("toast"); el.textContent = msg; el.dataset.kind = kind; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, kind === "error" ? 6000 : 3200);
}
const jobs = { list: [], timer: null, listeners: new Set() };
async function refreshJobs() {
  if (SNAP) return;
  try { jobs.list = await api.get("/api/jobs"); } catch { return; }
  for (const fn of jobs.listeners) fn(jobs.list);
  const active = jobs.list.some((j) => j.status === "queued" || j.status === "running");
  const badge = document.getElementById("jobs-badge");
  if (badge) { badge.hidden = !active; badge.textContent = String(jobs.list.filter((j) => j.status === "queued" || j.status === "running").length); }
  clearTimeout(jobs.timer);
  if (active) jobs.timer = setTimeout(refreshJobs, 1200);
}
async function startJob(params, doneMessage) {
  const job = await api.send("POST", "/api/jobs", params);
  toast(`Started: ${params.type}`);
  refreshJobs();
  return new Promise((resolve) => {
    const check = (list) => { const j = list.find((x) => x.id === job.id); if (!j || j.status === "queued" || j.status === "running") return; jobs.listeners.delete(check); if (j.status === "done") { toast(doneMessage ?? `Done: ${j.type}`, "ok"); resolve(j); } else { toast(`Failed: ${j.error}`, "error"); resolve(j); } };
    jobs.listeners.add(check);
  });
}

// ---------- shared UI pieces ----------
const STAGE_COLORS = { ingredients: "#2FB8A3", prep: "#4C8EDA", cooking: "#F28C28", plating: "#A98BE8", hero: "#E5B62A", serving: "#5FC29E", eating: "#E8739A", talking_head: "#7A9AB8", lifestyle: "#9DB36B", meal_prep: "#38B6D6", packaging: "#B78A5B", workout: "#D95F9A", transition: "#8A8A96" };
const SLOT_COLORS = { hook: "#E5B62A", ingredients: "#2FB8A3", cook: "#F28C28", plating: "#A98BE8", hero: "#E5B62A", cta: "#8B7CF6", protein: "#4C8EDA", macros: "#E5B62A", reaction: "#E8739A", portion: "#38B6D6", spotlight: "#2FB8A3" };
const STAGES = ["ingredients", "prep", "cooking", "plating", "hero", "serving", "eating", "talking_head", "lifestyle", "meal_prep", "packaging", "workout", "transition"];
const SHOT_TYPES = ["extreme_close_up", "close_up", "medium", "wide", "overhead", "pov", "detail"];
const CAMERA = ["static", "pan", "tilt", "push_in", "pull_out", "handheld", "slider", "orbit", "whip"];
const COVERAGE = ["ingredients", "prep", "cooking", "plating", "hero", "eating"];
const QC_LABELS = { duration: ["Duration", "Trim the longest segments or pick a shorter template."], frame: ["Frame size", "Re-render; the conform targets the platform frame."], fps: ["Frame rate", "Re-render."], filesize: ["File size", "Lower the CRF/preset in fce.config.json render settings."], loudness: ["Loudness", "Re-render: audio is normalised to the platform target."], true_peak: ["True peak", "Re-render with music lower or without music."], captions: ["Caption coverage", "Give every segment a caption."], safe_zone: ["Safe zone", "Raise captions.marginBottomPct in the brand kit."], caption_length: ["Caption length", "Shorten the caption or raise maxCharsPerLine."], unique_shots: ["Unique shots", "Swap one of the repeated segments."], pacing: ["Pacing", "Nudge in/out so shots sit inside the pacing range."], hook: ["Hook", "Swap the first segment for a hook-worthy or hero shot."], ai_broll_share: ["AI B-roll share", "Replace AI inserts with real footage."], ai_hero: ["AI on hero", "Never use AI footage for the hero or CTA."], gaps: ["Gaps", "Film the missing stage or request AI B-roll for inserts."], file: ["Render file", "Render the plan first."] };
const stageStyle = (stage) => `style="--stage:${STAGE_COLORS[stage] ?? "#8A8A96"}"`;
const stageChip = (stage) => stage ? `<span class="chip stage" ${stageStyle(stage)}>${esc(label(stage))}</span>` : `<span class="chip">untagged</span>`;
const qDots = (q) => `<span class="q" title="quality ${q ?? "?"}/5">${[1, 2, 3, 4, 5].map((i) => `<i class="${(q ?? 0) >= i ? "on" : ""}"></i>`).join("")}</span>`;
const flags = (s) => [s.hero_worthy ? `<span class="badge gold">Hero</span>` : "", s.hook_worthy ? `<span class="badge gold">Hook</span>` : "", s.dead ? `<span class="badge fail">Dead</span>` : "", s.clip_ai_generated || s.ai_generated ? `<span class="badge ai">AI</span>` : "", s.used ? `<span class="badge neutral">used ×${s.used}</span>` : ""].join("");
function shotTile(s, { rank, href, sub } = {}) {
  const frames = (s.frames ?? []).filter(Boolean);
  const img = frames[1] ?? frames[0] ?? "";
  const link = href ?? `#/library/${s.clip_id}?shot=${s.id}`;
  return `<a class="shot ${s.dead ? "dead" : ""}" href="${esc(link)}" data-shot="${s.id}">
    <div class="pic" data-frames='${esc(JSON.stringify(frames))}'>${img ? `<img src="${esc(img)}" alt="${esc(s.description ?? "")}" loading="lazy" decoding="async">` : `<div class="ph" style="position:absolute;inset:0;--stage:${STAGE_COLORS[s.stage] ?? "#555"}">${esc((s.clip_filename ?? "").split("_")[3] ?? s.stage ?? "no keyframe")}</div>`}
      ${rank != null ? `<span class="rank">#${rank}${s.facets ? ` · ${s.matched}/${s.facets}` : ""}</span>` : ""}<span class="dur">${fmtS(s.duration)}</span>
      ${frames.length > 1 ? `<span class="dots">${frames.map((_, i) => `<i class="${i === Math.min(1, frames.length - 1) ? "on" : ""}"></i>`).join("")}</span>` : ""}</div>
    <div class="meta"><div class="row" style="gap:6px">${stageChip(s.stage)}<span class="small muted">${esc(label(s.shot_type ?? ""))}${s.camera_motion ? " · " + esc(label(s.camera_motion)) : ""}</span></div>
      <div class="t" title="${esc(s.clip_filename)}">${esc(sub ?? s.caption_suggestion ?? s.description ?? s.clip_filename)}</div>
      <div class="s">${esc(s.clip_recipe ?? "")} · ${esc((s.actions ?? []).map(label).join(", ") || "no action tagged")}</div>
      <div class="row between" style="gap:6px">${qDots(s.quality)}<span class="flags">${flags(s)}</span></div></div></a>`;
}
function bindScrub(root) {
  root.querySelectorAll(".pic[data-frames]").forEach((pic) => {
    const frames = JSON.parse(pic.dataset.frames || "[]");
    if (frames.length < 2) return;
    const img = pic.querySelector("img"); const dots = pic.querySelectorAll(".dots i");
    const show = (i) => { if (img.src !== frames[i]) img.src = frames[i]; dots.forEach((d, k) => d.classList.toggle("on", k === i)); };
    pic.addEventListener("mousemove", (e) => { const r = pic.getBoundingClientRect(); show(Math.min(frames.length - 1, Math.max(0, Math.floor(((e.clientX - r.left) / r.width) * frames.length)))); });

}
function openModal(html) { const m = document.getElementById("modal"); m.innerHTML = `<div class="modal-bg" data-close><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; m.hidden = false; m.querySelector(".modal").focus?.(); }

document.getElementById("modal").addEventListener("click", (e) => { if (e.target.dataset.close != null || e.target.closest("[data-close-modal]")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); document.getElementById("drawer").hidden = true; } if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); go("#/search"); setTimeout(() => document.getElementById("q")?.focus(), 50); } });

const meter = (total, target, ideal) => { const pct = Math.min(100, (total / Math.max(target, 0.1)) * 100); const short = total < target * 0.95; return `<div class="meter ${short ? "short" : ""}" title="${fmtS(total)} of ${fmtS(target)} target${ideal ? `; ideal ${ideal[0]}–${ideal[1]}s` : ""}"><b style="width:${pct}%"></b></div>`; };
const qcBadge = (qc) => !qc ? `<span class="badge neutral">not rendered</span>` : qc.passed ? `<span class="badge pass">PASS${qc.warn ? ` · ${qc.warn} warn` : ""}</span>` : `<span class="badge fail">FAIL · ${qc.fail}</span>`;
const platformBadge = (p, w, h) => `<span class="badge neutral">${esc(title(p))} · ${w}×${h}</span>`;
function setTitle(t) { document.getElementById("page-title").textContent = t; document.title = `${t} · Food Content Engine`; }
const cache = { status: null, brand: null, templates: null, report: null };
async function status(force) { if (!cache.status || force) cache.status = await api.get("/api/status"); return cache.status; }

const platformOf = (kit, id) => kit?.platforms?.[id] ?? { width: 1080, height: 1920, fps: 30, safeZone: { top: 0, bottom: 0, left: 0, right: 0 } };

// ---------- plan / variants form ----------
async function openPlanForm({ mode = "variants", recipe = "", template = "" } = {}) {
  const [st, kit, tpls] = await Promise.all([status(), brandKit(), templates()]);
  const sets = Object.keys(kit.variantSets ?? { default: [] });
  const recipeOpts = st.recipes.map((r) => `<option value="${esc(r.recipe)}" ${r.recipe === recipe ? "selected" : ""}>${esc(r.recipe)} (${r.clips} clips)</option>`).join("");
  const dish = recipe ? title(recipe.split("-").filter((t) => !/^(mealprep|meal|prep|v\d+)$/.test(t)).join(" ")) : "";

    <div class="row between"><h2 style="margin:0">${mode === "variants" ? "Make variants" : "New plan"}</h2><button type="button" class="btn ghost sm" data-close-modal>Close</button></div>
    <div class="tabs"><button type="button" class="${mode === "variants" ? "on" : ""}" data-mode="variants">Variants (one recipe → many formats)</button><button type="button" class="${mode === "plan" ? "on" : ""}" data-mode="plan">Single plan</button></div>

      <div class="field" data-only="variants"><label for="f-set">Variant set</label><select id="f-set" name="set">${sets.map((s) => `<option value="${esc(s)}">${esc(s)} (${(kit.variantSets[s] ?? []).length} templates: ${esc((kit.variantSets[s] ?? []).join(", "))})</option>`).join("")}</select></div>
    </div>
    <fieldset class="card" style="border-color:var(--line)"><legend class="eyebrow">Recipe facts (used by hooks, macro cards and post copy)</legend>
      <div class="grid cols-3">
        <div class="field"><label for="f-dish">Dish name</label><input id="f-dish" name="dish" type="text" value="${esc(dish)}" placeholder="Grilled Chicken Bowl"></div>
        <div class="field"><label for="f-protein">Protein per serving (g)</label><input id="f-protein" name="protein_grams" type="number" min="0" placeholder="42"></div>
        <div class="field"><label for="f-cal">Calories</label><input id="f-cal" name="calories" type="number" min="0" placeholder="520"></div>

    ctx.font = `${(kit.fonts?.caption?.weight ?? 400) >= 600 ? "bold " : ""}${fs}px "${fam}", "IBM Plex Sans", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.lineJoin = "round"; ctx.lineWidth = (c.outlinePx ?? 3) * sc * 2;
    let text = "42g protein bowl in 20 min"; if (c.uppercase) text = text.toUpperCase(); const words = text.split(" "); const lines = []; let cur = ""; for (const w of words) { if ((cur + " " + w).trim().length > (c.maxCharsPerLine ?? 22) && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); } if (cur) lines.push(cur);
    lines.reverse().forEach((line, i) => { const y = cv.height - margin - i * fs * 1.15; ctx.strokeStyle = kit.colors?.captionOutline ?? "#000"; ctx.strokeText(line, cv.width / 2, y); const parts = line.split(/(\d+(?:[.,]\d+)?\s?(?:g|kg|ml|min|kcal|cal|%|x)?\b)/i).filter(Boolean); const widths = parts.map((t) => ctx.measureText(t).width); let x = cv.width / 2 - widths.reduce((a, b) => a + b, 0) / 2; ctx.textAlign = "left"; parts.forEach((t, k) => { ctx.fillStyle = c.highlightKeywords && /\d/.test(t) ? kit.colors?.captionHighlight ?? "#FFD23F" : kit.colors?.captionText ?? "#fff"; ctx.fillText(t, x, y); x += widths[k]; }); ctx.textAlign = "center"; });
    const warn = view.querySelector("#pv-warn"); const marginPx = (H * (c.marginBottomPct ?? 20)) / 100; warn.textContent = marginPx < (sz.bottom ?? 0) ? `marginBottomPct puts captions ${Math.round((sz.bottom ?? 0) - marginPx)}px inside ${p.label ?? platformId}'s bottom UI zone; the renderer clamps to the safe zone and QC would warn.` : `Caption margin ${Math.round(marginPx)}px clears the ${p.label ?? platformId} bottom zone (${sz.bottom ?? 0}px).`; warn.style.color = marginPx < (sz.bottom ?? 0) ? "var(--warn)" : "var(--muted)";
  }
  draw();
};

// ---------- b-roll ----------
routes.broll = async (view, r) => {
  setTitle("AI B-roll");
  const [sheets, plans, st] = await Promise.all([api.get("/api/broll"), api.get("/api/plans"), status()]);
  const withGaps = plans.filter((p) => p.gaps > 0); const sel = r.params.get("plan") ?? ""; const open = r.params.get("sheet") ?? sheets[0]?.file ?? "";
  const sheet = sheets.find((s) => s.file === open);
  view.innerHTML = `<div class="grid side-8-4" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><div class="stack">
    <form class="card stack" id="bform" data-live><h3>Write a prompt sheet</h3><p class="hint" style="margin:0">Prompts match the brand's visual style and name a real reference frame from the library. ${st.aiMode === "claude" ? "Art-directed by Claude." : "Offline: built from the brand kit's visual style."}</p>
      <div class="field"><label for="b-plan">Gaps from a plan</label><select id="b-plan" name="planId"><option value="">None</option>${withGaps.map((p) => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.templateName)} · ${esc(p.recipe ?? "library")} (${p.gaps} gap${p.gaps > 1 ? "s" : ""})</option>`).join("")}</select></div>
      <div class="field"><label for="b-needs">Extra needs, one per line</label><textarea id="b-needs" name="needs" rows="4" placeholder="extreme close-up of teriyaki glaze bubbling&#10;steam rising off jasmine rice"></textarea></div>
      <div class="row between"><span class="hint">Rule: AI inserts ≤ ${Math.round((cache.brand?.aiBroll?.maxShareOfRuntime ?? 0.2) * 100)}% of runtime, never the hero.</span><button class="btn primary" type="submit">Write prompt sheet</button></div></form>
    <div class="card"><h3>Sheets</h3>${sheets.length ? sheets.map((s) => `<a class="btn ghost" style="display:flex;justify-content:space-between;width:100%" href="#/broll?sheet=${encodeURIComponent(s.file)}"><span>${esc(s.file.replace(/^broll-requests-|\.json$/g, ""))}</span><span class="muted small">${s.requests.length} request${s.requests.length > 1 ? "s" : ""}</span></a>`).join("") : `<p class="small muted">No sheets yet.</p>`}</div></div>
    <div class="stack">${sheet ? `<div class="card"><div class="row between"><h3 style="margin:0">${esc(sheet.file.replace(/\.json$/, ""))}</h3><button class="btn sm ghost" id="copy-sheet">Copy all as markdown</button></div>
        ${sheet.reference ? `<div class="row" style="margin-top:10px"><img class="thumb" style="width:120px" src="${esc(sheet.reference.frameUrl ?? "")}" alt=""><div><div class="small"><b>Style reference</b> — upload this frame as the image/style reference in the generator.</div><div class="mono small muted">${esc(sheet.reference.file)}</div></div></div>` : ""}
        <ol class="stack" style="padding-left:18px;margin:12px 0 0;gap:12px">${sheet.requests.map((q) => `<li><b>${esc(q.need)}</b> <span class="muted small">· ${q.seconds}s · ${esc(q.camera)}</span>
          <div class="stack" style="gap:6px;margin-top:6px">${[["Image prompt", q.image_prompt], ["Motion prompt (image → video)", q.motion_prompt], ["Negative prompt", q.negative_prompt]].map(([l, t]) => `<div><div class="eyebrow">${l}</div><div class="copyblock">${esc(t)}<button class="btn sm" data-copy="${esc(t)}">Copy</button></div></div>`).join("")}<p class="hint" style="margin:0">Continuity: ${esc(q.notes)}</p></div></li>`).join("")}</ol>
        <p class="hint" style="margin-top:12px">Workflow: still image (4 candidates) → pick one → image-to-video 3–5 s → grade with the brand LUT → save to <code>04_assets/ai-broll/</code> → Ingest &amp; Analyze. QC caps AI inserts and blocks them on the hero.</p></div>` : `<div class="empty"><strong>No prompt sheet selected.</strong>Pick a plan with gaps or type a need, then write a sheet.</div>`}</div></div>`;
  view.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => copyText(b.dataset.copy)));
  view.querySelector("#copy-sheet")?.addEventListener("click", () => copyText(sheet.requests.map((q, i) => `## ${i + 1}. ${q.need}\n\n**Image prompt**\n${q.image_prompt}\n\n**Motion prompt**\n${q.motion_prompt}\n\n**Negative**\n${q.negative_prompt}\n\nContinuity: ${q.notes}\n`).join("\n"), "Sheet copied"));
  view.querySelector("#bform")?.addEventListener("submit", async (e) => { e.preventDefault(); const fd = new FormData(e.target); const j = await startJob({ type: "broll", planId: fd.get("planId") || null, needs: String(fd.get("needs") ?? "").split("\n").map((x) => x.trim()).filter(Boolean), offline: st.aiMode !== "claude" }, "Prompt sheet written"); if (j.status === "done") go(`#/broll?sheet=${encodeURIComponent(j.result.file)}`); });
};

// ---------- jobs ----------
function jobHtml(j) {
  const badge = j.status === "done" ? "pass" : j.status === "failed" ? "fail" : j.status === "running" ? "warn" : "neutral";
  const result = j.result?.planId ? `<a class="btn sm ghost" href="#/plans/${encodeURIComponent(j.result.planId)}">Open plan</a>` : j.result?.plans ? j.result.plans.map((p) => `<a class="btn sm ghost" href="#/plans/${encodeURIComponent(p.planId)}">${esc(p.planId.split("__")[1] ?? p.planId)}</a>`).join("") : j.result?.file ? `<a class="btn sm ghost" href="#/broll?sheet=${encodeURIComponent(j.result.file)}">Open sheet</a>` : "";
  const target = j.params?.recipe ?? j.params?.planId ?? j.params?.clipId ?? "";
  const pos = j.status === "queued" ? jobs.list.filter((x) => x.status === "queued" && x.id > j.id).length + 1 : 0;
  return `<div class="job"><div class="row between"><span><b>${esc(j.type)}</b> <span class="muted small">${esc(String(target))}</span></span><span class="badge ${badge}">${esc(j.status)}${pos ? ` · ${pos}${pos === 1 ? "st" : pos === 2 ? "nd" : pos === 3 ? "rd" : "th"} in line` : ""}</span></div>${j.log?.length ? `<pre>${esc(j.log.slice(-6).join("\n"))}</pre>` : ""}${j.error ? `<div class="small" style="color:var(--fail)">${esc(j.error)}</div>` : ""}<div class="row between"><span class="faint small">${esc((j.started_at ?? j.created_at ?? "").slice(11, 19))}${j.finished_at ? ` → ${esc(j.finished_at.slice(11, 19))}` : ""}</span><span class="row">${result}</span></div></div>`;
}
routes.jobs = async (view) => {
  setTitle("Jobs");
  const list = SNAP ? [] : await api.get("/api/jobs");
  view.innerHTML = `<div class="stack">${SNAP ? `<div class="empty"><strong>Jobs run in the live app.</strong>This snapshot is read-only.</div>` : list.length ? list.map(jobHtml).join("") : `<div class="empty"><strong>Nothing has run yet.</strong>Analyze, plan, render and QC jobs appear here with their logs.</div>`}</div>`;
  if (!SNAP) jobs.listeners.add(function upd(l) { if (route().screen !== "jobs") return jobs.listeners.delete(upd); view.innerHTML = `<div class="stack">${l.map(jobHtml).join("")}</div>`; });
};
function drawer() {
  const d = document.getElementById("drawer");
  const paint = (list) => { d.innerHTML = `<div class="drawer"><div class="row between"><h3 style="margin:0">Jobs</h3><button class="btn ghost sm" id="drawer-close">Close</button></div>${list.length ? list.slice(0, 12).map(jobHtml).join("") : `<p class="muted small">Nothing running.</p>`}<a class="btn sm ghost" href="#/jobs">All jobs</a></div>`; d.querySelector("#drawer-close").addEventListener("click", () => { d.hidden = true; jobs.listeners.delete(paint); }); };
  d.hidden = false; paint(jobs.list); jobs.listeners.add(paint); refreshJobs();
}

// ---------- boot ----------
async function boot() {
  try { const t = localStorage.getItem("fce.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  document.getElementById("theme-toggle").addEventListener("click", () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("fce.theme", next); } catch {} });
  document.getElementById("jobs-open").addEventListener("click", drawer);
  if (SNAP) { const b = document.getElementById("snapbanner"); b.hidden = false; b.textContent = `Read-only snapshot generated ${new Date(SNAP.generated).toLocaleString()} — browsing and search work; actions need the local app (fce ui).`; document.querySelectorAll("[data-live]").forEach((el) => (el.hidden = true)); new MutationObserver(() => document.querySelectorAll("[data-live]").forEach((el) => (el.hidden = true))).observe(document.getElementById("view"), { childList: true, subtree: true }); }
  try { const st = await status(); document.getElementById("proj-name").textContent = st.brandName || "Food Content Engine"; document.getElementById("proj-path").textContent = st.library; const ai = document.getElementById("pill-ai"); ai.className = `pill ${st.aiMode === "claude" ? "ok" : "warn"}`; ai.innerHTML = `<i></i>${st.aiMode === "claude" ? esc(st.model) : "offline tagging"}`; const ff = document.getElementById("pill-ffmpeg"); ff.className = `pill ${st.ffmpeg ? "ok" : "bad"}`; ff.innerHTML = `<i></i>${st.ffmpeg ? "ffmpeg ready" : "ffmpeg missing"}`; } catch (err) { toast(`Cannot reach the engine: ${err.message}`, "error"); }
  if (!location.hash) location.hash = "#/dashboard";
  render();
  refreshJobs();
}
boot();
</script>
