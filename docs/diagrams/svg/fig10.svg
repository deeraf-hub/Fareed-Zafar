 x="1092" y="387.7" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Register webhook: callback</text><text x="1092" y="404.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">https://host/webhook + VERIFY_TOKEN;</text><text x="1092" y="421.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">subscribe ‘messages’ + the Page</text><text x="1348" y="387.7" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Meta</text><text x="1348" y="404.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">verification</text><text x="1348" y="421.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">succeeded?</text><text x="1348" y="536.2" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Check the callback URL</text><text x="1348" y="553.3" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">and VERIFY_TOKEN match</text><text x="647.5" y="393.4" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="13.0" font-weight="400" fill="#1F2937">Yes</text><text x="566" y="486.4" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="13.0" font-weight="400" fill="#1F2937">No</text><text x="1364" y="496.4" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" fo