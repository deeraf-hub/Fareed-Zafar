xt x="305" y="119.1" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Facebook Page (admin) + Meta</text><text x="305" y="136.2" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Business Portfolio · Meta developer</text><text x="305" y="153.3" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">app (type: Business) · host with a</text><text x="305" y="170.4" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">public HTTPS URL</text><text x="620" y="127.7" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Add the Messenger and</text><text x="620" y="144.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">WhatsApp products</text><text x="620" y="161.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">to the Meta app</text><text x="950" y="127.7" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Phone number ID → WHATSAPP_PHONE_NUMBER_ID</text><text x="950" y="144.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Verify recipient by SMS → WHATSAPP_RECIPIENT</text><text x="950" y="161.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">System User token → WHATSAPP_TOKEN</text><text x