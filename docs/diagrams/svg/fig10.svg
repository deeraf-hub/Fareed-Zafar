enger_message</text><text x="1020" y="729.1" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">App Review: Advanced Access</text><text x="1020" y="746.2" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">for pages_messaging · Business</text><text x="1020" y="763.3" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Verification if prompted ·</text><text x="1020" y="780.4" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">switch the app to Live</text><text x="1270" y="737.7" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">Point an uptime monitor</text><text x="1270" y="754.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">(e.g. UptimeRobot) at</text><text x="1270" y="771.8" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="400" fill="#1F2937">GET /healthz</text><text x="1480" y="746.2" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#1F2937">Live: messages</text><text x="1480" y="763.3" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="14.0" font-weight="700" fill="#1F2937">forwarded 24/7</text><rect x="57.89999999999999" y="675" width="194.20000000000002" height="21" rx="10.5" fill="#1F4E79"/><text x="155" y="689.6" text-anchor="middle" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif" font-size="12.0" font-weight